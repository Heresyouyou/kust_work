  /* 自研 kpdf 内核渲染宿主（替代 iframe + Chromium 原生 PDF）

    .loading-wrap { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);

<script>
// ═══════════════════════════════════════════════
//  GeoTranslate — 自研 kpdf 内核渲染 + SyncGroup 双栏同步
// ═══════════════════════════════════════════════

const $ = id => document.getElementById(id);
const S = {
    iframeZoom: 140,
    currentName: null,
    currentJobId: null,
    currentMonoUrl: null,
    currentDualUrl: null,
    pollingCtrl: null,
};

const input = $('fileInput');
const chip = $('fileChip');
const chipName = $('chipName');
const chipClose = $('chipClose');
const downloadOpts = $('downloadOpts');
const downloadBtn = $('downloadBtn');
const leftEmpty = $('leftEmpty');
const leftView = $('leftView');      // 自研 kpdf 渲染宿主（原 iframe）
const leftStatus = $('leftStatus');
const leftPage = $('leftPage');
const rightEmpty = $('rightEmpty');
const rightDot = $('rightDot');
const loadingWrap = $('loadingWrap');
const rightView = $('rightView');    // 自研 kpdf 渲染宿主（原 iframe）
const rightStatus = $('rightStatus');
const rightPage = $('rightPage');
const pctNum = $('pctNum');
const loadMsg = $('loadMsg');
const uploadBar = $('uploadBar');
const uploadFill = $('uploadFill');
const leftZoom = $('leftZoom');
const rightZoom = $('rightZoom');
const cancelBtn = $('cancelBtn');

// ═══════════════════════════════════════════════════════════════
//  GeoTranslate — 自研 kpdf 内核（替代 iframe + Chromium 原生 PDF）
//
//  旧实现：两个 <iframe> 套 Chromium 内置 viewer，靠它的私有 postMessage
//          协议 + hash 兜底 + 500ms 轮询做同步；缩放还被 Chromium 的
//          0.5/0.75/1/1.25… 枚举值卡住，只能取近似值。
//  新实现：左右各挂一个单栏 kpdf viewer，跨实例用 SyncGroup 做归一化锚点
//          同步；缩放是连续值，滚动/缩放双向同步由内核负责，不再轮询。
// ═══════════════════════════════════════════════════════════════

const KP = {
  mod: null,       // 懒加载的 kpdf 模块（零构建 ESM，首次用到才拉模块图）
  left: null,      // 左 reader 实例
  right: null,     // 右 reader 实例
  group: null,     // 跨实例 SyncGroup
  master: 'left',  // 用户最后操作的一侧
};

/** 懒加载 kpdf 模块图。 */
async function kpdfMod() {
  if (!KP.mod) {
    const [idx, sync] = await Promise.all([
      import('/api/reader/assets/kpdf/index.js'),
      import('/api/reader/assets/kpdf/sync.js'),
    ]);
    KP.mod = {
      createReader: idx.createReader,
      SyncGroup: sync.SyncGroup,
      SYNC_MODE: sync.SYNC_MODE,
      SCALE_MODE: sync.SCALE_MODE,
    };
  }
  return KP.mod;
}

const paneView = (which) => KP[which]?.views?.[0] || null;
const paneHost = (which) => (which === 'left' ? leftView : rightView);

/** 挂载（或换掉）一侧的 PDF。 */
async function mountPane(which, url) {
  if (!url) return null;
  const host = paneHost(which);
  // 自己负责收起空态占位：否则 .empty 会以 flex 项身份把渲染宿主挤成一条
  // （setPdfFrame 也会收，但 mountPane 可能被直接调用，不能依赖调用方）
  (which === 'left' ? leftEmpty : rightEmpty)?.classList.add('hidden');
  // ⚠️ 必须在建视图之前让宿主可见并完成布局：宿主若还是 display:none，
  //    宽度为 0，viewport 的 fit:'width' 会按 0 宽算 scale，页面会缩成几十像素。
  host.classList.remove('hidden');
  void host.offsetWidth;   // 强制一次 reflow，确保尺寸已生效
  const { createReader } = await kpdfMod();

  // 换文档前先销毁旧实例：否则 PDF.js worker 与事件监听会泄漏
  if (KP[which]) { try { KP[which].destroy(); } catch (e) { /* ignore */ } KP[which] = null; }

  const reader = await createReader(host, {
    panes: [{ src: url, label: which === 'left' ? '原文' : '译文' }],
    mode: 'continuous',
    fit: 'width',
    // 翻译页自己有缩放/翻页控件，宿主里不留阅读器的工具栏与侧栏
    toolbar: false, statusbar: false, findbar: false, sidebar: null,
    sync: { enabled: false },   // 单栏；两侧同步交给下面的 SyncGroup
  });
  KP[which] = reader;

  const view = paneView(which);
  if (view) {
    const pageEl = which === 'left' ? leftPage : rightPage;
    const showPage = () => {
      const total = view.doc?.numPages ?? KP[which]?.docs?.[0]?.numPages ?? '—';
      pageEl.textContent = `${(view.page ?? 0) + 1} / ${total}`;
    };
    view.on('scroll', showPage);
    view.on('scale', showPage);
    showPage();

    // 谁在滚，谁是 master
    view.on('scroll', (e) => { if (!e?.programmatic) KP.master = which; });
    // 内核自己处理 Ctrl+Wheel 缩放，这里只把结果回写到百分比显示
    view.on('scale', (e) => {
      if (e?.programmatic) return;
      S.iframeZoom = Math.round((e.scale ?? 1) * 100);
      leftZoom.textContent = S.iframeZoom + '%';
      rightZoom.textContent = S.iframeZoom + '%';
    });
  }

  host.classList.remove('hidden');
  ensureSync();
  return reader;
}

/** 两侧都就绪后建立跨实例同步（归一化锚点 + 等比缩放）。 */
function ensureSync() {
  const l = paneView('left'), r = paneView('right');
  if (!l || !r || !KP.mod) return;
  if (KP.group) {
    try { KP.group.remove(l); KP.group.remove(r); } catch (e) { /* ignore */ }
    KP.group = null;
  }
  const { SyncGroup, SYNC_MODE, SCALE_MODE } = KP.mod;
  KP.group = new SyncGroup({
    mode: SYNC_MODE.ANCHOR,
    scaleMode: SCALE_MODE.FIT,
    enabled: true,
  });
  KP.group.add(l, { master: true });
  KP.group.add(r);
}

// ── 对外接口（与原 iframe 实现同名，调用点无需改动） ──
function setPdfFrame(url, el) {
  if (!url) return;
  const which = (el === leftView) ? 'left' : 'right';
  leftEmpty?.classList.add('hidden');
  rightEmpty?.classList.add('hidden');
  mountPane(which, url).catch((e) => {
    console.error('[kpdf] 挂载失败', e);
    const st = which === 'left' ? leftStatus : rightStatus;
    if (st) st.textContent = '渲染失败';
  });
}

function clearPdfFrame(el) {
  const which = (el === leftView) ? 'left' : 'right';
  if (KP[which]) { try { KP[which].destroy(); } catch (e) { /* ignore */ } KP[which] = null; }
  if (KP.group) { try { KP.group.destroy?.(); } catch (e) { /* ignore */ } KP.group = null; }
  const host = paneHost(which);
  host.classList.add('hidden');
  host.replaceChildren();
}

// ── 翻页（kpdf 内部页码 0-based，UI 传 1-based） ──
function goToPage(page) {
  const n = Math.max(0, (page | 0) - 1);
  for (const w of ['left', 'right']) paneView(w)?.gotoPage?.(n);
}
// view.page 是 0-based：下一页 = page+1（0-based）= 1-based 的 page+2
function nextPage() { goToPage((paneView('left')?.page ?? 0) + 2); }
// 上一页 = page-1（0-based）= 1-based 的 page；page=0 时 goToPage(0) 会夹到第 1 页
function prevPage() { goToPage(paneView('left')?.page ?? 0); }

function _updatePageDisplay() { /* 页码由 kpdf 的 scroll/scale 事件驱动 */ }

// ── 缩放：连续值，不再被 Chromium 的 0.5/0.75/1/1.25… 枚举近似卡住 ──
const ZMIN = 25, ZMAX = 800, ZSTEP = 10;
function _applyZoom(pct) {
  S.iframeZoom = Math.max(ZMIN, Math.min(ZMAX, pct));
  leftZoom.textContent = S.iframeZoom + '%';
  rightZoom.textContent = S.iframeZoom + '%';
  const z = S.iframeZoom / 100;
  for (const w of ['left', 'right']) paneView(w)?.setScale?.(z, { by: 'toolbar' });
}
// 快捷键里历史上叫过这个名字（原本是个未定义的 bug），保留别名
const setIframeZoom = _applyZoom;

// ── 翻页 / 缩放按钮 ──
$('leftPrev').onclick = () => { KP.master = 'left'; prevPage(); };
$('leftNext').onclick = () => { KP.master = 'left'; nextPage(); };
$('rightPrev').onclick = () => { KP.master = 'right'; prevPage(); };
$('rightNext').onclick = () => { KP.master = 'right'; nextPage(); };

$('zoomLeftIn').onclick = () => _applyZoom(Math.min(ZMAX, S.iframeZoom + ZSTEP));
$('zoomLeftOut').onclick = () => _applyZoom(Math.max(ZMIN, S.iframeZoom - ZSTEP));
$('zoomLeftReset').onclick = () => _applyZoom(140);
$('zoomRightIn').onclick = () => _applyZoom(Math.min(ZMAX, S.iframeZoom + ZSTEP));
$('zoomRightOut').onclick = () => _applyZoom(Math.max(ZMIN, S.iframeZoom - ZSTEP));
$('zoomRightReset').onclick = () => _applyZoom(140);

// ── 键盘翻页 ──
document.addEventListener('keydown', e => {
  if (['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)) return;
  if (e.key === 'PageDown') { e.preventDefault(); nextPage(); }
  else if (e.key === 'PageUp') { e.preventDefault(); prevPage(); }
  else if (e.key === 'Home') { e.preventDefault(); goToPage(1); }
});

// Ctrl+Wheel 缩放由 kpdf 内核自己处理（viewport 内部 wheel → setScale），
// 结果经 SyncGroup 同步到另一侧，这里不再外层劫持，避免双重缩放。

// ── 文件选择 + 拖拽 ──
document.addEventListener('drop', e => {
    e.preventDefault(); e.stopPropagation();
    if (e.dataTransfer?.files?.length) handleFile(e.dataTransfer.files[0]);
});
document.addEventListener('dragover', e => { e.preventDefault(); e.stopPropagation(); });
document.addEventListener('dragleave', e => { e.preventDefault(); });
if (input) {
    input.addEventListener('change', () => {
        if (input.files?.length) handleFile(input.files[0]);
    });
}
if (leftEmpty) {
    leftEmpty.addEventListener('click', () => input?.click());
}

// ── 快捷键 ──
document.addEventListener('keydown', e => {
    if (['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)) return;
    if (e.ctrlKey || e.metaKey) {
        if (e.key === '=' || e.key === '+') { e.preventDefault(); setIframeZoom(Math.min(ZMAX, S.iframeZoom + ZSTEP)); }
        else if (e.key === '-') { e.preventDefault(); setIframeZoom(Math.max(ZMIN, S.iframeZoom - ZSTEP)); }
        else if (e.key === '0') { e.preventDefault(); setIframeZoom(140); }
    }
});

// ── 分割线 ──
(function initDivider() {
    const divider = $('divider'), lp = $('leftPane'), rp = $('rightPane'), app = document.querySelector('.app');
    let dragging = false;
    divider.addEventListener('mousedown', e => {
        dragging = true; divider.classList.add('active');
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
        e.preventDefault();
    });
    document.addEventListener('mousemove', e => {
        if (!dragging) return;
        const rect = app.getBoundingClientRect();
        const pct = ((e.clientX - rect.left) / rect.width) * 100;
        const lpct = Math.max(15, Math.min(85, pct));
        lp.style.flex = '0 0 ' + lpct + '%';
        rp.style.flex = '0 0 ' + (100 - lpct) + '%';
    });
    document.addEventListener('mouseup', () => {
        if (dragging) { dragging = false; divider.classList.remove('active');
            document.body.style.cursor = ''; document.body.style.userSelect = ''; }
    });
})();

// ── 下载按钮 (radio 单选: mono / dual / both) ──
function _triggerDownload(url) {
    if (!url) return false;
    const a = document.createElement('a');
    a.href = url; a.download = '';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    return true;
}
downloadBtn.addEventListener('click', () => {
    const fmt = document.querySelector('input[name="dlFmt"]:checked')?.value || 'mono';
    const mono = S.currentMonoUrl;
    const dual = S.currentDualUrl;

    if (fmt === 'mono') {
        if (!_triggerDownload(mono)) alert('中文版暂未生成');
    } else if (fmt === 'dual') {
        if (!_triggerDownload(dual)) alert('双语对照版暂未生成');
    } else {  // both
        let ok = false;
        if (mono) { _triggerDownload(mono); ok = true; }
        setTimeout(() => {
            if (dual) { _triggerDownload(dual); ok = true; }
            if (!ok) alert('暂无可下载的译版');
        }, 400);
    }
});

// ── 进度轮 ──
function updateProgressRing(pct) {
    const fg = document.querySelector('.progress-ring .fg');
    if (fg) {
        const PROG_CIRC = 201.1;
        fg.style.strokeDashoffset = PROG_CIRC - (PROG_CIRC * pct / 100);
    }
}

// ── BabelDOC stage → 4 大阶段映射 ──
function _stageGroup(stage) {
    const P  = ['Parse PDF and Create IR','DetectScannedFile','Parse Page Layout','Parse Table','Parse Paragraphs','Parse Formulas and Styles'];
    const T  = ['Translate Paragraphs'];
    const Ty = ['Typesetting','Add Fonts','Generate drawing instructions'];
    const O  = ['Subset font','Save PDF'];
    if (P.includes(stage))  return 'parse';
    if (T.includes(stage))  return 'translate';
    if (Ty.includes(stage)) return 'typeset';
    if (O.includes(stage))  return 'output';
    return null;
}
function _updateStageBars(stageProgresses, currentStage) {
    // 聚合每个大阶段的进度
    const groups = { parse: [], translate: [], typeset: [], output: [] };
    if (stageProgresses) {
        for (const [st, p] of Object.entries(stageProgresses)) {
            const g = _stageGroup(st);
            if (g) groups[g].push(p);
        }
    }
    // 算每个大阶段的 max 进度 (只要组内任一 stage 完成就算 done)
    const totals = {};
    for (const [g, arr] of Object.entries(groups)) {
        totals[g] = arr.length ? Math.max(...arr) : 0;
    }
    // 更新 DOM
    document.querySelectorAll('.stage-bar-row').forEach(row => {
        const g = row.dataset.stage;
        const pct = Math.round(totals[g] || 0);
        const fill = row.querySelector('.s-fill');
        const pctEl = row.querySelector('.s-pct');
        fill.style.width = pct + '%';
        pctEl.textContent = pct + '%';
        row.classList.remove('active', 'done');
        const rowGroup = _stageGroup(currentStage);
        if (pct >= 100) row.classList.add('done');
        else if (g === rowGroup && pct > 0) row.classList.add('active');
    });
}
function _resetStageBars() {
    document.querySelectorAll('.stage-bar-row').forEach(row => {
        row.querySelector('.s-fill').style.width = '0%';
        row.querySelector('.s-pct').textContent = '0%';
        row.classList.remove('active', 'done');
    });
}


// ── 主入口: handleFile ──
async function handleFile(file) {
    if (!file.name.toLowerCase().endsWith('.pdf')) return;

    S.currentName = file.name;
    chipName.textContent = file.name;
    chip.classList.add('show');
    downloadOpts.classList.add('hidden');

    // 重置 UI
    leftEmpty.classList.add('hidden');
    leftStatus.textContent = '检测中...';
    rightEmpty.classList.add('hidden');
    loadingWrap.classList.remove('hidden');
    rightStatus.textContent = '';
    rightDot.style.background = 'var(--muted)';
    pctNum.textContent = '0';
    loadMsg.textContent = '准备中...';
    uploadBar.style.display = 'none';
    _resetStageBars();

    // 1) 查缓存
    try {
        const cr = await fetch('/api/check', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({name: file.name}),
        }).then(r => r.json());
        if (cr.exists) {
            // 命中 → 跳过 upload 的轮询阶段, upload 会秒返回 done
            console.log('📦 Cache hit, uploading original...');
        }
    } catch(e) { /* check may not exist */ }

    // 2) 上传
    try {
        const fd = new FormData();
        fd.append('file', file);
        const r = await fetch('/api/upload', {method: 'POST', body: fd});
        const data = await r.json();
        if (r.ok) {
            S.onReadyLeft = data.original_url;
            setPdfFrame(data.original_url, leftView);
            leftStatus.textContent = '已加载';
            // 缓存命中 → upload 直接返回 done
            if (data.cache_hit || data.status === 'done') {
                S.currentMonoUrl = data.mono_url;
                S.currentDualUrl = data.dual_url;
                if (data.mono_url) setPdfFrame(data.mono_url, rightView);
                rightStatus.textContent = '已翻译 (缓存)';
                loadingWrap.classList.add('hidden');
                if (data.mono_url) downloadOpts.classList.remove('hidden');
                console.log('✅ Cache hit! Skip queue.');
            } else if (data.job_id) {
                S.currentJobId = data.job_id;
                startPoll(data.job_id);
            }
        }
    } catch(e) {
        pctNum.textContent = '❌';
        loadMsg.textContent = '上传失败';
    }
}

// ── 轮询进度 ──
function startPoll(jobId) {
    if (S.pollingCtrl) S.pollingCtrl.abort();
    S.pollingCtrl = new AbortController();
    const signal = S.pollingCtrl.signal;
    let interval = 1500;
    let consecutiveFail = 0;

    async function poll() {
        try {
            const r = await fetch('/api/status/' + jobId, {signal});
            if (!r.ok) throw new Error(r.status);
            const d = await r.json();
            consecutiveFail = 0;
            interval = 1500;

            // 更新进度
            updateProgressRing(d.progress || 0);
            pctNum.textContent = d.progress + '%';
            loadMsg.textContent = d.message || '处理中...';
            _updateStageBars(d.stage_progresses || {}, d.current_stage || '');

            // 队列位置
            if (d.status === 'queued') {
                pctNum.textContent = d.queue_position || '?';
                loadMsg.textContent = `前方 ${(d.queue_position||1)-1} 个任务 · 排队中`;
                cancelBtn.style.display = 'inline-block';
                cancelBtn.textContent = '✕ 取消排队';
            }

            // 翻译中
            if (d.status === 'translating') {
                rightStatus.textContent = '翻译中';
                cancelBtn.style.display = 'inline-block';
                cancelBtn.textContent = '✕ 取消翻译';
            }

            // 完成
            if (d.status === 'done') {
                updateProgressRing(100);
                pctNum.textContent = '100';
                loadMsg.textContent = '完成';
                rightStatus.textContent = '完成';
                rightDot.style.background = '#4CAF50';
                loadingWrap.classList.add('hidden');
                cancelBtn.style.display = 'none';
                S.currentMonoUrl = d.mono_url;
                S.currentDualUrl = d.dual_url;
                if (d.mono_url) setPdfFrame(d.mono_url, rightView);
                downloadOpts.classList.remove('hidden');
                return; // 停止轮询
            }

            // 用户取消
            if (d.status === 'cancelled') {
                pctNum.textContent = '—';
                loadMsg.textContent = '已取消';
                rightStatus.textContent = '已取消';
                rightDot.style.background = '#888';
                loadingWrap.classList.add('hidden');
                cancelBtn.style.display = 'none';
                return;
            }

            // 失败
            if (d.status === 'failed') {
                pctNum.textContent = '❌';
                loadMsg.textContent = '失败: ' + (d.error || d.message);
                rightStatus.textContent = '错误';
                rightDot.style.background = '#f44336';
                loadingWrap.classList.add('hidden');
                cancelBtn.style.display = 'none';
                return;
            }
        } catch(e) {
            if (signal.aborted) return;
            consecutiveFail++;
            interval = Math.min(interval * 1.3, 8000);
        }

        if (!signal.aborted)
            setTimeout(poll, interval);
    }
    poll();
}

// ── 重置 ──
chipClose.addEventListener('click', () => {
    if (S.pollingCtrl) S.pollingCtrl.abort();
    S.currentName = S.currentJobId = S.currentMonoUrl = null;
    chip.classList.remove('show');
    downloadOpts.classList.add('hidden');
    leftEmpty.classList.remove('hidden');
    rightEmpty.classList.remove('hidden');
    clearPdfFrame(leftView);
    clearPdfFrame(rightView);
    loadingWrap.classList.add('hidden');
});

// ── 取消任务 ──
cancelBtn.addEventListener('click', async () => {
    if (!S.currentJobId) return;
    const ok = confirm('确定要取消当前翻译任务吗？');
    if (!ok) return;
    cancelBtn.style.display = 'none';
    loadMsg.textContent = '取消中...';
    try {
        const r = await fetch('/api/cancel/' + S.currentJobId, {method: 'POST'});
        const d = await r.json();
        if (d.ok) {
            // poll 会自动检测状态变化
        } else {
            loadMsg.textContent = '取消失败: ' + (d.error || '未知错误');
        }
    } catch(e) {
        loadMsg.textContent = '取消失败: ' + e.message;
    }
});

// ── 网络状态 ──
window.addEventListener('online', () => document.querySelector('.net-alert')?.classList.remove('show'));
window.addEventListener('offline', () => document.querySelector('.net-alert')?.classList.add('show'));

console.log('GeoTranslate UI ready ✅');
</script>
