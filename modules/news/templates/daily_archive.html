<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>早报归档 · kust.work</title>
<style>
  /* 深色为默认值（/theme.js 缺失也完整可读）；浅色由 theme.js 注入的
     :root[data-theme="light"] 覆盖。新增颜色一律走变量，勿写死色值。 */
  :root {
    /* 面 */
    --bg: #2b2b2b; --surface: #1f1f1f; --surface-2: #262626; --surface-3: #2f2f2f;
    /* 线 */
    --border: #3a3a3a; --border-hover: #4a4a4a;
    /* 字 */
    --text: #e8e4df; --muted: #8a867f; --dim: #6f6b64; --link: #cfd8d2;
    /* 主色 */
    --accent: #4a9e6a; --accent-dim: #2d6e46; --accent-line: #2d6e46;
    --accent-soft: #232823; --accent-soft-hover: #242a24;
    --on-accent: #101710; --logo-bg: #2d6e46; --logo-fg: #e2f3e8;
    --meta-key: #5f7d69;
    /* 语义 */
    --warn: #f0a030; --warn-border: #6a4a15; --err: #c0524a;
    /* 关键词 chip */
    --kw-bg: #22261f; --kw-bd: #333a30; --kw-fg: #8d9b8f;
    /* 组件 */
    --sw-border: rgba(255,255,255,.07); --sw-shadow: 0 4px 12px rgba(0,0,0,.45);
    --toast-bg: #1a1a1a; --placeholder: #6a665f;
    --scroll-bg: #1a1a1a; --scroll-track: #222222; --scroll-thumb: #444444;
    --card-shadow: none; --radius: 6px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
  a { color: inherit; text-decoration: none; }

  header { height: 48px; background: var(--surface); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 20px; gap: 12px; flex-shrink: 0;
    position: sticky; top: 0; z-index: 10; }
  .back { font-size: 12px; color: var(--muted); }
  .back:hover { color: var(--accent); }
  .logo { width: 24px; height: 24px; border-radius: 5px; background: var(--logo-bg);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600; color: var(--logo-fg); letter-spacing: -0.3px; }
  .brand { font-weight: 600; font-size: 14px; letter-spacing: -0.3px; }
  .spacer { flex: 1; }
  .stat { font-size: 12px; color: var(--muted); }

  main { flex: 1; width: 100%; max-width: 1000px; margin: 0 auto; padding: 32px 20px 48px; }
  .head { margin-bottom: 18px; }
  .head h1 { font-size: 21px; font-weight: 600; letter-spacing: -0.4px; margin-bottom: 6px; }
  .head p { font-size: 12.5px; color: var(--muted); line-height: 1.7; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--card-shadow); transition: border-color .18s; }
  .card:hover { border-color: var(--border-hover); }
  .card a.thumb { display: block; background: var(--surface-2); border-bottom: 1px solid var(--border); }
  .card a.thumb img { width: 100%; display: block; aspect-ratio: 16 / 9; object-fit: cover; }
  .card .no-poster { width: 100%; aspect-ratio: 16 / 9; display: flex; align-items: center;
    justify-content: center; color: var(--dim); font-size: 12px; background: var(--surface-2); }
  .c-body { padding: 13px 15px 14px; display: flex; flex-direction: column; gap: 9px; flex: 1; }
  .c-date { font-size: 15px; font-weight: 600; letter-spacing: -0.2px; }
  .c-meta { font-size: 11.5px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
  .c-tag { font-size: 10px; padding: 1px 7px; border-radius: 3px; border: 1px solid var(--border); color: var(--dim); }
  .c-tag.snap { border-color: var(--accent-dim); color: var(--accent); }
  .c-go { margin-top: auto; font-size: 12px; padding: 7px 0; text-align: center; border-radius: 4px;
    border: 1px solid var(--accent-dim); background: var(--accent-soft); color: var(--accent); transition: .16s; }
  .c-go:hover { background: var(--accent-soft-hover); border-color: var(--accent); }

  .loading { padding: 60px 0; text-align: center; color: var(--muted); font-size: 13px; }
  .empty { padding: 60px 0; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.8; }

  footer { border-top: 1px solid var(--border); background: var(--surface);
    padding: 11px 20px; font-size: 11px; color: var(--muted); line-height: 1.8; flex-shrink: 0; }
  footer code { font-family: ui-monospace, Consolas, monospace; color: var(--text); }

  @media (max-width: 640px) {
    main { padding: 24px 14px 36px; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
<!-- 主题引擎：必须同步加载（勿加 defer/async），否则会先闪深色再变浅色。 -->
<script src="/theme.js"></script>
</head>
<body>

<header>
  <a class="back" href="/daily">&larr; 今日早报</a>
  <span class="logo">ku</span>
  <span class="brand">早报归档</span>
  <span class="spacer"></span>
  <span class="stat" id="st">加载中…</span>
</header>

<main>
  <div class="head">
    <h1>每日早报归档</h1>
    <p>按日期回看历史早报：新闻列表 + 日报海报。每次访问「今日早报」会自动存一份当天快照，所以越往后历史越全；更早日期若留有海报也会在此列出（仅海报，新闻未存档）。</p>
  </div>

  <div id="body"><div class="loading">正在读取归档列表…</div></div>
</main>

<footer>
  数据源 <code>daily_archive/*.json</code>（访问 /daily 时落盘）· <code>output/daily_poster_*.png</code>（历史海报，只读）
</footer>

<script>
(function () {
  var body = document.getElementById('body');
  var st = document.getElementById('st');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function card(e) {
    var thumb = e.poster
      ? '<a class="thumb" href="/daily?date=' + esc(e.date) + '">'
        + '<img alt="海报" src="/daily/poster/' + esc(e.date8) + '?t=' + Date.now() + '"></a>'
      : '<div class="no-poster">无海报</div>';
    var tags = [];
    tags.push(e.has_snapshot ? '<span class="c-tag snap">含新闻 ' + e.news_count + ' 条</span>'
                             : '<span class="c-tag">仅海报</span>');
    if (e.doc_url) tags.push('<span class="c-tag">有飞书文档</span>');
    return '<div class="card">'
      + thumb
      + '<div class="c-body">'
      + '<div class="c-date">' + esc(e.date) + '</div>'
      + '<div class="c-meta">' + tags.join('') + '</div>'
      + '<a class="c-go" href="/daily?date=' + esc(e.date) + '">查看该日早报 →</a>'
      + '</div></div>';
  }

  fetch('/api/daily/archive', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      var es = (d.entries || []);
      st.textContent = es.length + ' 期早报';
      if (!es.length) {
        body.innerHTML = '<div class="empty">暂无归档<br>访问一次「今日早报」就会自动存下当天快照</div>';
        return;
      }
      body.innerHTML = '<div class="grid">' + es.map(card).join('') + '</div>';
    })
    .catch(function () {
      body.innerHTML = '<div class="empty">读取归档列表失败</div>';
      st.textContent = '读取失败';
    });
})();
</script>

</body>
</html>
