<script>
/* 通用轻量交互：顶部进度线 + 目录高亮。
   与具体汇报无关，因此放在外壳里 —— 每份汇报都自动拥有，
   自定义版式的汇报另有自己的 story.js 做数据渲染，两者互不干扰。 */
(function () {
  'use strict';
  var prog = document.getElementById('prog');
  var links = Array.prototype.slice.call(document.querySelectorAll('.toc a[href^="#"]'));
  // 目录锚点的目标可能是 section[id]，也可能是 md 渲染出来的 h2[id]
  var secs = Array.prototype.slice.call(document.querySelectorAll('section[id], h2[id], h3[id]'));

  function onScroll() {
    var h = document.documentElement.scrollHeight - window.innerHeight;
    var y = window.scrollY || window.pageYOffset;
    if (prog) prog.style.width = (h > 0 ? Math.min(100, (y / h) * 100) : 0) + '%';

    var cur = '';
    secs.forEach(function (s) {
      if (s.getBoundingClientRect().top <= 140) cur = s.id;
    });
    links.forEach(function (a) {
      a.classList.toggle('on', a.getAttribute('href') === '#' + cur);
    });
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);
  onScroll();
})();
</script>
<!--STORY_JS-->
