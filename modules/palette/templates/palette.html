<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>科研配色 · kust.work</title>
<style>
  /* 深色为默认值（/theme.js 缺失也完整可读）；浅色由 theme.js 注入的
     :root[data-theme="light"] 覆盖。新增颜色一律走变量，勿写死色值。 */
  :root {
    /* 面 */
    --bg: #2b2b2b; --surface: #1f1f1f; --surface-2: #262626; --surface-3: #2f2f2f;
    /* 线 */
    --border: #3a3a3a; --border-hover: #4a4a4a;
    /* 字 */
    --text: #e8e4df; --muted: #8a867f; --dim: #6f6b64; --link: #cfd8d2;
    /* 主色 */
    --accent: #4a9e6a; --accent-dim: #2d6e46; --accent-line: #2d6e46;
    --accent-soft: #232823; --accent-soft-hover: #242a24;
    --on-accent: #101710; --logo-bg: #2d6e46; --logo-fg: #e2f3e8;
    --meta-key: #5f7d69;
    /* 语义 */
    --warn: #f0a030; --warn-border: #6a4a15; --err: #c0524a;
    /* 相关度分档 */
    --tier-strong-bg: #23402e; --tier-strong-fg: #79d39b; --tier-strong-bd: #2f5a3e;
    --tier-mid-bg: #23323f; --tier-mid-fg: #7fb5d8; --tier-mid-bd: #2f4757;
    --tier-low-bg: #33312a; --tier-low-fg: #b3a67c; --tier-low-bd: #4a4638;
    /* 关键词 chip */
    --kw-bg: #22261f; --kw-bd: #333a30; --kw-fg: #8d9b8f;
    /* 组件 */
    --sw-border: rgba(255,255,255,.07); --sw-shadow: 0 4px 12px rgba(0,0,0,.45);
    --toast-bg: #1a1a1a; --placeholder: #6a665f;
    --vb-hover-bg: #24352a; --vb-hover-fg: #9dc9ae;
    --scroll-bg: #1a1a1a; --scroll-track: #222222; --scroll-thumb: #444444;
    --stage-track: rgba(255,255,255,.08); --stage-fill: rgba(255,255,255,.12);
    --shimmer: rgba(255,255,255,.05);
    --pdf-shadow: 0 4px 18px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.04);
    --card-shadow: none;
    --radius: 6px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
  a { color: inherit; text-decoration: none; }

  header { height: 48px; background: var(--surface); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 20px; gap: 12px; flex-shrink: 0;
    position: sticky; top: 0; z-index: 20; }
  .back { font-size: 12px; color: var(--muted); }
  .back:hover { color: var(--accent); }
  .logo { width: 24px; height: 24px; border-radius: 5px; background: var(--logo-bg);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600; color: var(--logo-fg); letter-spacing: -0.3px; }
  .brand { font-weight: 600; font-size: 14px; letter-spacing: -0.3px; }
  .spacer { flex: 1; }
  .stat { font-size: 12px; color: var(--muted); }

  main { flex: 1; width: 100%; max-width: 1180px; margin: 0 auto; padding: 32px 20px 48px; }

  .head { margin-bottom: 20px; }
  .head h1 { font-size: 21px; font-weight: 600; letter-spacing: -0.4px; margin-bottom: 6px; }
  .head p { font-size: 12.5px; color: var(--muted); line-height: 1.7; }

  .bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    margin-bottom: 22px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
  .tab { font-size: 12px; padding: 6px 13px; border-radius: 4px; border: 1px solid var(--border);
    color: var(--muted); cursor: pointer; background: transparent; transition: .16s; }
  .tab:hover { color: var(--text); border-color: var(--border-hover); }
  .tab.on { color: var(--accent); border-color: var(--accent-line); background: var(--accent-soft); }
  .sum { margin-left: auto; font-size: 11.5px; color: var(--muted); }
  .sum b { color: var(--text); font-weight: 600; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 17px 15px; margin-bottom: 14px; box-shadow: var(--card-shadow); }
  .card:hover { border-color: var(--border-hover); }
  .c-top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 5px; }
  .c-name { font-size: 14.5px; font-weight: 600; letter-spacing: -0.2px; }
  .c-src { font-size: 11px; color: var(--accent); font-family: ui-monospace, Consolas, monospace; }
  .c-note { font-size: 12px; color: var(--muted); line-height: 1.65; margin-bottom: 13px; }

  /* 连续型：渐变条 */
  .grad { height: 30px; border-radius: 4px; border: 1px solid var(--border); margin-bottom: 11px; }

  /* 离散型：色块 */
  .sw-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .sw { position: relative; border-radius: 4px; border: 1px solid var(--sw-border);
    cursor: pointer; transition: transform .14s, box-shadow .14s; overflow: hidden; }
  .sw:hover { transform: translateY(-2px); box-shadow: var(--sw-shadow); }
  .sw:active { transform: translateY(0); }
  .sw.big { width: 52px; height: 52px; }
  .sw.sm { width: 40px; height: 34px; }

  .hexes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
  .hx { font-size: 10.5px; font-family: ui-monospace, Consolas, "Courier New", monospace;
    padding: 3px 7px; border-radius: 3px; background: var(--surface-2);
    border: 1px solid var(--border); color: var(--muted); cursor: pointer; transition: .14s; }
  .hx:hover { color: var(--text); border-color: var(--border-hover); }

  .lbls { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .lb { font-size: 10.5px; color: var(--muted); padding: 2px 7px; border-radius: 3px;
    border: 1px solid var(--border); }

  .c-foot { display: flex; align-items: center; gap: 10px; margin-top: 12px;
    padding-top: 11px; border-top: 1px solid var(--surface-3); }
  .cp-btn { font-size: 11px; padding: 5px 11px; border-radius: 4px; cursor: pointer;
    border: 1px solid var(--border); background: transparent; color: var(--muted); transition: .16s; }
  .cp-btn:hover { color: var(--accent); border-color: var(--accent-dim); }
  .c-count { font-size: 11px; color: var(--dim); margin-left: auto; }

  .loading { padding: 60px 0; text-align: center; color: var(--muted); font-size: 13px; }

  /* 复制提示 */
  #toast { position: fixed; left: 50%; bottom: 34px; transform: translate(-50%, 18px);
    background: var(--toast-bg); border: 1px solid var(--accent-dim); color: var(--text);
    font-size: 12.5px; padding: 9px 17px; border-radius: 5px; opacity: 0;
    pointer-events: none; transition: opacity .2s, transform .2s; z-index: 100;
    font-family: ui-monospace, Consolas, monospace; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }

  footer { border-top: 1px solid var(--border); background: var(--surface);
    padding: 11px 20px; font-size: 11px; color: var(--muted); line-height: 1.8; flex-shrink: 0; }
  footer code { font-family: ui-monospace, Consolas, monospace; color: var(--text); }

  @media (max-width: 640px) {
    main { padding: 24px 14px 36px; }
    .sw.big { width: 42px; height: 42px; }
    .sum { margin-left: 0; width: 100%; }
  }
</style>
<!-- 主题引擎：必须同步加载（勿加 defer/async），否则会先闪深色再变浅色。
     由它在右上角挂出「自动 / 浅色 / 深色」三态切换按钮。 -->
<script src="/theme.js"></script>
</head>
<body>

<header>
  <a class="back" href="/">&larr; 工作台</a>
  <span class="logo">ku</span>
  <span class="brand">科研配色</span>
  <span class="spacer"></span>
  <span class="stat" id="st">加载中…</span>
</header>

<main>
  <div class="head">
    <h1>科研配色色卡</h1>
    <p>点击任意色块或色号即可复制 HEX 值，可直接粘进 matplotlib / Origin / AI / PPT</p>
  </div>

  <div class="bar" id="bar">
    <button class="tab on" data-group="all">全部</button>
    <span class="sum" id="sum">—</span>
  </div>

  <div id="body"><div class="loading">正在读取色板数据…</div></div>
</main>

<footer>
  来源：ggsci（Nature / Science / NEJM / Lancet / JAMA / JCO 期刊配色）·
  国际年代地层表 ICS / CGMW 官方色码 · matplotlib 连续色阶 · ColorBrewer
</footer>

<div id="toast"></div>

<script>
(function () {
  var DATA = null, GROUP = 'all';
  var body = document.getElementById('body');
  var sum = document.getElementById('sum');
  var st = document.getElementById('st');
  var bar = document.getElementById('bar');
  var toast = document.getElementById('toast');
  var toastTimer = null;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('on');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove('on'); }, 1600);
  }

  // 剪贴板：优先 navigator.clipboard（需 https/localhost），失败回落 execCommand
  function copy(text, label) {
    var done = function () { showToast('已复制 ' + label); };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done).catch(function () { fallback(text, label, done); });
    } else {
      fallback(text, label, done);
    }
  }
  function fallback(text, label, done) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); }
    catch (e) { showToast('复制失败，请手动选择 ' + label); }
    document.body.removeChild(ta);
  }

  function isContinuous(p) {
    return p.type === 'sequential' || p.type === 'diverging';
  }

  function swatchRow(p) {
    var cont = isContinuous(p);
    var cls = cont ? 'sw sm' : 'sw big';
    return p.colors.map(function (c) {
      return '<div class="' + cls + '" style="background:' + esc(c.hex) + '" '
        + 'data-hex="' + esc(c.hex) + '" title="' + esc(c.hex) + '"></div>';
    }).join('');
  }

  function hexRow(p) {
    return '<div class="hexes">' + p.colors.map(function (c) {
      return '<span class="hx" data-hex="' + esc(c.hex) + '" title="点击复制">' + esc(c.hex) + '</span>';
    }).join('') + '</div>';
  }

  function gradientBar(p) {
    if (!isContinuous(p)) return '';
    var stops = p.colors.map(function (c, i) {
      return c.hex + ' ' + (i / (p.colors.length - 1) * 100).toFixed(1) + '%';
    }).join(', ');
    return '<div class="grad" style="background:linear-gradient(90deg,' + esc(stops) + ')"></div>';
  }

  function labelRow(p) {
    var has = p.colors.length && p.colors[0].label;
    if (!has) return '';
    return '<div class="lbls">' + p.colors.map(function (c) {
      return '<span class="lb" style="border-left:3px solid ' + esc(c.hex) + '">' + esc(c.label) + '</span>';
    }).join('') + '</div>';
  }

  function card(p) {
    var hexList = p.colors.map(function (c) { return c.hex; }).join(' ');
    return '<div class="card" data-id="' + esc(p.id) + '">'
      + '<div class="c-top"><span class="c-name">' + esc(p.name) + '</span>'
      + '<span class="c-src">' + esc(p.source) + '</span></div>'
      + '<div class="c-note">' + esc(p.note) + '</div>'
      + gradientBar(p)
      + '<div class="sw-row">' + swatchRow(p) + '</div>'
      + labelRow(p)
      + hexRow(p)
      + '<div class="c-foot">'
      + '<button class="cp-btn" data-all="' + esc(hexList) + '">复制整组（' + p.colors.length + ' 色）</button>'
      + '<span class="c-count">' + esc(p.type) + '</span>'
      + '</div></div>';
  }

  function render() {
    var list = DATA.palettes.filter(function (p) {
      return GROUP === 'all' || p.group === GROUP;
    });
    if (!list.length) { body.innerHTML = '<div class="loading">该分类下暂无色板</div>'; return; }

    var html = '', lastGroup = null;
    list.forEach(function (p) {
      if (p.group !== lastGroup) {
        lastGroup = p.group;
        html += '<div class="grp-t" style="font-size:11px;color:var(--muted);letter-spacing:1.2px;'
          + 'margin:22px 0 12px;padding-bottom:9px;border-bottom:1px solid var(--border)">'
          + esc(p.group) + '</div>';
      }
      html += card(p);
    });
    body.innerHTML = html;
  }

  // 事件委托：色块 / 色号 / 整组复制
  body.addEventListener('click', function (e) {
    var sw = e.target.closest('[data-hex]');
    if (sw) { copy(sw.getAttribute('data-hex'), sw.getAttribute('data-hex')); return; }
    var btn = e.target.closest('[data-all]');
    if (btn) {
      var all = btn.getAttribute('data-all');
      copy(all, all.split(' ').length + ' 色');
    }
  });

  fetch('/api/palette/list', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d.ok) throw new Error(d.error || 'bad payload');
      DATA = d;
      st.textContent = d.palette_count + ' 组色板 · ' + d.color_count + ' 个色值';
      sum.innerHTML = '共 <b>' + d.palette_count + '</b> 组 · <b>' + d.color_count + '</b> 个色值';

      // 按分组生成筛选按钮
      d.groups.forEach(function (g) {
        var b = document.createElement('button');
        b.className = 'tab';
        b.setAttribute('data-group', g);
        b.textContent = g;
        bar.insertBefore(b, sum);
      });
      render();
    })
    .catch(function () {
      body.innerHTML = '<div class="loading">读取色板数据失败</div>';
      st.textContent = '读取失败';
    });

  bar.addEventListener('click', function (e) {
    var t = e.target.closest('.tab');
    if (!t || !DATA) return;
    Array.prototype.forEach.call(bar.querySelectorAll('.tab'), function (x) { x.classList.remove('on'); });
    t.classList.add('on');
    GROUP = t.getAttribute('data-group');
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
})();
</script>

</body>
</html>
