<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>译文归档 · kust.work</title>
<style>
  /* 深色为默认值（/theme.js 缺失也完整可读）；浅色由 theme.js 注入的
     :root[data-theme="light"] 覆盖。新增颜色一律走变量，勿写死色值。 */
  :root {
    /* 面 */
    --bg: #2b2b2b; --surface: #1f1f1f; --surface-2: #262626; --surface-3: #2f2f2f;
    /* 线 */
    --border: #3a3a3a; --border-hover: #4a4a4a;
    /* 字 */
    --text: #e8e4df; --muted: #8a867f; --dim: #6f6b64; --link: #cfd8d2;
    /* 主色 */
    --accent: #4a9e6a; --accent-dim: #2d6e46; --accent-line: #2d6e46;
    --accent-soft: #232823; --accent-soft-hover: #242a24;
    --on-accent: #101710; --logo-bg: #2d6e46; --logo-fg: #e2f3e8;
    --meta-key: #5f7d69;
    /* 语义 */
    --warn: #f0a030; --warn-border: #6a4a15; --err: #c0524a;
    /* 相关度分档 */
    --tier-strong-bg: #23402e; --tier-strong-fg: #79d39b; --tier-strong-bd: #2f5a3e;
    --tier-mid-bg: #23323f; --tier-mid-fg: #7fb5d8; --tier-mid-bd: #2f4757;
    --tier-low-bg: #33312a; --tier-low-fg: #b3a67c; --tier-low-bd: #4a4638;
    /* 关键词 chip */
    --kw-bg: #22261f; --kw-bd: #333a30; --kw-fg: #8d9b8f;
    /* 组件 */
    --sw-border: rgba(255,255,255,.07); --sw-shadow: 0 4px 12px rgba(0,0,0,.45);
    --toast-bg: #1a1a1a; --placeholder: #6a665f;
    --vb-hover-bg: #24352a; --vb-hover-fg: #9dc9ae;
    --scroll-bg: #1a1a1a; --scroll-track: #222222; --scroll-thumb: #444444;
    --stage-track: rgba(255,255,255,.08); --stage-fill: rgba(255,255,255,.12);
    --shimmer: rgba(255,255,255,.05);
    --pdf-shadow: 0 4px 18px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.04);
    --card-shadow: none;
    --radius: 6px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
  a { color: inherit; text-decoration: none; }

  header { height: 48px; background: var(--surface); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 20px; gap: 14px; flex-shrink: 0;
    position: sticky; top: 0; z-index: 5; }
  .back { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }
  .back:hover { color: var(--accent); }
  .title { font-size: 14px; font-weight: 600; letter-spacing: -0.3px; }
  .spacer { flex: 1; }
  .count { font-size: 12px; color: var(--muted); }

  main { flex: 1; width: 100%; max-width: 1040px; margin: 0 auto; padding: 26px 20px 48px; }

  .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .search { flex: 1; min-width: 180px; max-width: 340px; padding: 7px 12px; font-size: 12px;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    color: var(--text); font-family: inherit; outline: none; }
  .search:focus { border-color: var(--accent); }
  .search::placeholder { color: var(--placeholder); }
  .window { font-size: 11px; color: var(--muted); }

  .list { border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--surface); overflow: hidden; box-shadow: var(--card-shadow); }

  .paper { display: flex; align-items: center; gap: 18px; padding: 13px 16px; }
  .paper + .paper { border-top: 1px solid var(--border); }
  .paper:hover { background: var(--surface-2); }

  .p-main { flex: 1; min-width: 0; }

  .p-opts { display: flex; gap: 8px; flex-wrap: wrap; }

  /* 版本按钮：可用的是 <a>，缺失的是置灰 <span>（不可点） */
  .vb { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px;
    padding: 5px 12px; border: 1px solid var(--border); border-radius: 5px;
    background: var(--surface-2); white-space: nowrap; }
  .vb em { font-style: normal; color: var(--muted); font-size: 10.5px;
    font-family: ui-monospace, Consolas, monospace; }
  .vb .arw { font-size: 10px; opacity: .45; }
  a.vb:hover { border-color: var(--accent); background: var(--vb-hover-bg); }
  a.vb:hover em { color: var(--vb-hover-fg); }
  a.vb:hover .arw { opacity: 1; color: var(--accent); }
  .vb.off { opacity: .32; cursor: not-allowed; }

  /* 「在线阅读」：与版本按钮视觉差异——
     边框/底色都换成 accent 绿，文字本身也用 accent，箭头更明显；
     hover 时箭头向右滑 2px，作为「会跳页」的暗示。 */
  a.vb-read {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11.5px; font-weight: 500;
    padding: 5px 11px;
    border: 1px solid var(--accent-line); border-radius: 5px;
    background: var(--accent-soft);
    color: var(--accent);
    white-space: nowrap;
    transition: background .15s, border-color .15s, color .15s;
  }
  a.vb-read .arw { font-size: 14px; line-height: 1; opacity: 1;
    transition: transform .18s ease; }
  a.vb-read:hover { background: var(--accent-soft-hover); border-color: var(--accent); color: var(--logo-fg); }
  a.vb-read:hover .arw { transform: translateX(2px); }
  .vb-read.off { opacity: .32; cursor: not-allowed; background: transparent;
    border-color: var(--border); color: var(--muted); }

  /* 标题本身也是入口：cursor/hover 与按钮形成「可点」暗示 */
  .p-ttl { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  a.p-ttl-link { color: inherit; text-decoration: none; display: block;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  a.p-ttl-link:hover { color: var(--accent); }
  a.p-ttl-link:hover .p-ttl-meta { color: var(--accent-dim); }
  .p-ttl-meta { font-size: 11px; color: var(--muted); margin-top: 4px;
    transition: color .15s; }

  .msg { padding: 48px 20px; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.9; }
  .msg a { color: var(--accent); }
</style>
<!-- 主题引擎：必须同步加载（勿加 defer/async），否则会先闪深色再变浅色。
     由它在右上角挂出「自动 / 浅色 / 深色」三态切换按钮。 -->
<script src="/theme.js"></script>
</head>
<body>

<header>
  <a class="back" href="/">&larr; 工作台</a>
  <span class="title">译文归档</span>
  <span class="spacer"></span>
  <span class="count" id="count">加载中</span>
</header>

<main>
  <div class="toolbar">
    <input class="search" id="q" type="search" placeholder="按论文标题筛选…" autocomplete="off">
    <span class="window" id="window"></span>
  </div>
  <div id="papers"><div class="msg">加载中…</div></div>
</main>

<script>
(function () {
  var papersEl = document.getElementById('papers');
  var countEl = document.getElementById('count');
  var winEl = document.getElementById('window');
  var qEl = document.getElementById('q');

  var papers = [];
  var windowHours = 48;

  function fmtSize(n) {
    if (!n) return '—';
    if (n < 1024) return n + ' B';
    if (n < 1048576) return (n / 1024).toFixed(0) + ' KB';
    return (n / 1048576).toFixed(1) + ' MB';
  }

  function fmtTime(ts) {
    var d = new Date(ts * 1000);
    var diff = (Date.now() - d.getTime()) / 1000;
    if (diff < 60) return '刚刚';
    if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
    if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
    var p = function (n) { return n < 10 ? '0' + n : '' + n; };
    return (d.getMonth() + 1) + '/' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // 可用版本 → 用后端给的绝对 NAS 直链（f.dl_url，带 ?dl=1）直接下载，不进阅读器
  // 缺失版本 → 置灰不可点的 span
  // 阅读器只保留「在线阅读」一个入口（原文 + 中文对照）。
  function vbHtml(f) {
    if (!f.available) {
      return '<span class="vb off" title="该论文没有' + esc(f.label) + '版本">' +
        esc(f.label) + '<em>无</em></span>';
    }
    return '<a class="vb" href="' + esc(f.dl_url || f.url) + '"' +
      ' title="' + esc(f.label) + ' · ' + esc(f.name) + ' · 点击下载（NAS 直链）">' +
      esc(f.label) + '<em>' + fmtSize(f.size) + '</em><span class="arw">&#8595;</span></a>';
  }

  // 「在线阅读」按钮：原文 + 中文/双语 一键进入阅读器双栏同步；
  // 没有原文时退化为置灰不可点。
  // 视觉与三个版本按钮明显不同：accent 绿边框 + accent 浅底 + accent 文字 + 箭头。
  function readHtml(p) {
    if (!p.reader_url) {
      var peer_label = p.reader_peer_kind === 'mono' ? '中文版'
        : p.reader_peer_kind === 'dual' ? '双语版' : '译文';
      return '<span class="vb-read off" title="没有原文 PDF，无法进入阅读器">' +
        '在线阅读<span class="arw">&rarr;</span></span>';
    }
    var title = '原文 + ' + (p.reader_peer_kind === 'mono' ? '中文版'
      : p.reader_peer_kind === 'dual' ? '双语版' : '无译文（仅原文）')
      + ' · 在新阅读器中打开';
    return '<a class="vb-read" href="' + esc(p.reader_url) + '" target="_blank" rel="noopener"' +
      ' title="' + esc(title) + '">在线阅读<span class="arw">&rarr;</span></a>';
  }

  function paperHtml(p) {
    var raw = p.files.filter(function (f) { return f.available; })
                     .map(function (f) { return f.name; }).join('\n');
    var titleHtml = '<div class="p-ttl" title="' + esc(raw) + '">' + esc(p.title) + '</div>' +
      '<div class="p-ttl-meta">' + fmtTime(p.mtime) + ' · ' + p.file_count + ' 个版本 · ' +
        fmtSize(p.total_size) + '</div>';
    // 标题与「在线阅读」等效：点击即进阅读器（原文 + 中文对照）。
    var titleBlock = p.reader_url
      ? '<a class="p-ttl-link" href="' + esc(p.reader_url) + '" target="_blank" rel="noopener"'
          + ' title="点击标题直接进入阅读器（同「在线阅读」）">' + titleHtml + '</a>'
      : titleHtml;
    return '<div class="paper">' +
      '<div class="p-main">' + titleBlock + '</div>' +
      '<div class="p-opts">' +
        p.files.map(vbHtml).join('') +
        readHtml(p) +
      '</div>' +
    '</div>';
  }

  function render() {
    var kw = qEl.value.trim().toLowerCase();
    var rows = kw ? papers.filter(function (p) {
      return String(p.title).toLowerCase().indexOf(kw) >= 0;
    }) : papers;

    var files = papers.reduce(function (a, p) { return a + p.file_count; }, 0);
    countEl.textContent = kw
      ? rows.length + ' / ' + papers.length + ' 篇'
      : papers.length + ' 篇 · ' + files + ' 个文件';

    if (!rows.length) {
      papersEl.innerHTML = '<div class="msg">' +
        (papers.length ? '没有匹配的论文' :
          '近 ' + windowHours + ' 小时还没有产出或上传的 PDF。<br>' +
          '<a href="/translate">去翻译一篇论文</a>') +
        '</div>';
      return;
    }

    papersEl.innerHTML = '<div class="list">' + rows.map(paperHtml).join('') + '</div>';
  }

  function load() {
    papersEl.innerHTML = '<div class="msg">加载中…</div>';
    fetch('/api/archive/list', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        windowHours = d.window_hours || 48;
        winEl.textContent = '仅显示最近 ' + windowHours + ' 小时的论文 · ' +
          '点版本按钮直接下载 · 「在线阅读」进原文+中文对照';
        papers = d.papers || [];
        render();
      })
      .catch(function () {
        papersEl.innerHTML = '<div class="msg">加载失败，请刷新重试</div>';
        countEl.textContent = '—';
      });
  }

  qEl.addEventListener('input', render);
  load();
})();
</script>

</body>
</html>
