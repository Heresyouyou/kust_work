<script>
(function () {
  var DATA = null, REGION = 'all', VIEW = 'latest', Q = '', MATCHED = 0;
  // 单卡默认折叠条数；点「展开其余 N 篇」后按 data-id 记住展开状态
  var PREVIEW_N = 6;
  var EXPANDED = {};
  var ALL_OPEN = false;   // 「全部展开」总开关：为 true 时所有卡片都铺开
  var body = document.getElementById('body');
  var allbtn = document.getElementById('allbtn');
  var sum = document.getElementById('sum');
  var st = document.getElementById('st');
  var bar = document.getElementById('bar');
  var vnote = document.getElementById('vnote');
  var legend = document.getElementById('legend');
  var todayEl = document.getElementById('today');

  var TIER_LABEL = { strong: '强相关', mid: '相关', low: '一般' };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function safeUrl(u) { return /^https?:\/\//i.test(u || '') ? u : ''; }

  // ── 标题右侧三按钮：下载 PDF / 在线阅读 / 一键翻译（2026-10-17）──
  // 与知识库搜索页（geokb_public 的 _translate_macros.html）同款图标与状态机，
  // 色值走本页 CSS 变量（--accent/--border/--surface-2/--warn/--err/--muted）。
  // ★ 语义（用户确认）：「下载 PDF」= **NAS → 用户本地**。
  //   网站 → NAS 由 daily_archive_papers.py 在期刊列表更新后自动完成，
  //   后端给每篇注入 archived / pdf_rel / eid：
  //     已归档 → 「下载 PDF ▾」点开选版本（原文 / 中文版 / 双语对照版）
  //     未归档 → 「在线抓取」补抓通道（抓完自动转可下载）
  //   阅读/翻译仅在有 eid（已归档并建档）时可用。
  var ICON_DL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2 2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';
  var ICON_DLOK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
  var ICON_EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  var ICON_TRANS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8l6 6M4 14l6-6 2-3M2 5h12M7 2h1"/><path d="M14 21l5-5 4 4-5 5-4-4z"/><path d="M17 14l-1.5-1.5"/><path d="M13 19h8v2h-8zM19 15l3 3"/></svg>';

  var ICON_GRAB = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2 2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/><path d="M2 6h4M4 4v4" stroke-width="1.5"/></svg>';

  // 阅读 / 翻译的共享属性（已归档才有 eid / pdf_rel）
  function readAttrs(a) {
    if (!a.eid) {
      return ' href="javascript:void(0)" aria-disabled="true" class="btn is-off j-read"'
        + ' title="尚未归档到 NAS：每日管线会在列表更新后自动抓取，抓到即可阅读"';
    }
    var single = '/PDFreader?file='
      + encodeURIComponent('/api/journals/pdf/' + (a.pdf_rel || ''))
      + '&title=' + encodeURIComponent(a.title || '');
    var pair = single + '&peer=' + encodeURIComponent('/geokb/pdf/' + a.eid + '/mono')
      + '&layout=continuous&sync=1';
    return ' href="' + esc(single) + '" class="btn j-read"'
      + ' data-read-link data-read-eid="' + esc(a.eid) + '"'
      + ' data-read-single="' + esc(single) + '"'
      + ' data-read-pair="' + esc(pair) + '"'
      + ' title="自研 canvas 阅读器打开；译文就绪后自动切双语对照"';
  }

  function trAttrs(a) {
    if (!a.eid) {
      return ' disabled data-state="idle"'
        + ' title="尚未归档到 NAS：抓到 PDF 后才能提交翻译"';
    }
    return ' data-eid="' + esc(a.eid) + '" data-state="idle"'
      + ' title="提交 NAS 原文到翻译队列，完成后译文归档到原文同目录"';
  }

  // 无 http(s) 链接的条目不渲染按钮（在线抓取接口必须要有源地址）。
  function artBtns(a) {
    if (!safeUrl(a.url)) return '';
    var meta = ' data-journal="' + esc(a.journal || '') + '"'
      + ' data-title="' + esc(a.title || '') + '"'
      + ' data-url="' + esc(a.url) + '"';
    var dl;
    if (a.archived && a.pdf_rel) {
      dl = '<button type="button" class="btn btn-primary j-dl j-dl-ready"' + meta
        + ' data-eid="' + esc(a.eid || '') + '"'
        + ' data-pdf-rel="' + esc(a.pdf_rel) + '"'
        + ' title="从 NAS 论文仓库下载到本地（点击选择版本：原文 / 中文版 / 双语对照版）">'
        + ICON_DL + '<span>下载 PDF</span></button>';
    } else {
      dl = '<button type="button" class="btn btn-primary j-dl j-dl-grab"' + meta
        + ' title="此篇尚未归档：点击立即从期刊官网抓取 PDF 到 NAS（正常由每日管线自动完成）">'
        + ICON_GRAB + '<span>在线抓取</span></button>';
    }
    return '<span class="art-btns">' + dl
      + '<a' + readAttrs(a) + '>' + ICON_EYE + '<span>在线阅读</span></a>'
      + '<button type="button" class="btn tr-btn j-tr" data-tr-btn' + trAttrs(a) + '>'
      + ICON_TRANS + '<span>一键翻译</span></button>'
      + '</span>';
  }

  // 全站搜索：按查询过滤某卡片的文章列表（标题 + 中文小字 + 主题命中词）。
  // 返回卡片的「过滤副本」，并打 _force 标记让卡片铺开全部匹配项（不再折叠预览）。
  function applyQuery(j) {
    var q = Q.trim().toLowerCase();
    if (!q) return j;
    var c = {
      id: j.id, name: j.name, name_cn: j.name_cn, name_en: j.name_en, short_name: j.short_name,
      website: j.website, site_host: j.site_host, publisher: j.publisher,
      doc_url: j.doc_url, category: j.category, level: j.level, frequency: j.frequency,
      sub: j.sub, article_total: j.article_total, topic_total: j.topic_total, topic_tiers: j.topic_tiers,
      has_today: j.has_today, today_count: j.today_count, article_newest_ts: j.article_newest_ts,
      _force: true
    };
    if (VIEW === 'latest') {
      var arts = (j.articles || []).filter(function (a) {
        return (a.title || '').toLowerCase().indexOf(q) >= 0
          || (a.title_zh || '').toLowerCase().indexOf(q) >= 0;
      });
      c.articles = arts;
      c.article_total = arts.length;
      c.article_newest = j.article_newest;
      c.article_undated = j.article_undated;
    } else {
      var ta = (j.topic_articles || []).filter(function (a) {
        return (a.title || '').toLowerCase().indexOf(q) >= 0
          || (a.title_zh || '').toLowerCase().indexOf(q) >= 0
          || (a.keywords || []).join(' ').toLowerCase().indexOf(q) >= 0
          || (a.date_label || '').toLowerCase().indexOf(q) >= 0;
      });
      c.topic_articles = ta;
      c.topic_total = ta.length;
    }
    return c;
  }

  // 近 60 天条目：标题 + 本地获取日期（MM-DD）+ 卷期
  // ★ 形参只能有一个：下面是 `shown.map(artRow)`，map 会把「下标」当第二个实参传进来。
  //   曾因签名写成 artRow(a, jname) 而把下标当刊名渲染，卡片里凭空冒出 1/2/3/4/5 灰字。
  function artRow(a) {
    var u = safeUrl(a.url);
    var t = u
      ? '<a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(a.title) + '</a>'
      : esc(a.title);
    var vi = a.volume ? '<span class="vi">v' + esc(a.volume) + (a.issue ? 'n' + esc(a.issue) : '') + '</span>' : '';
    var ob = a.obtained_label
      ? '<span class="ob" title="本地获取时间 ' + esc(a.obtained_at || a.obtained_label) + '">'
        + esc(a.obtained_label) + '</span>'
      : '';
    // 英文条目下方挂中文小字（离线预翻译，没有就不显示，绝不占位）
    var zh = a.title_zh ? '<div class="tzh">' + esc(a.title_zh) + '</div>' : '';
    return '<div class="art"><span class="mk">▸</span><div class="t">' + t + artBtns(a) + zh + '</div>'
      + ob + vi + '</div>';
  }

  // 今日条目：同为一条 .art（样式与下方卡片完全一致），两处与 artRow 不同 ——
  //   ① 日期换成**时刻**（当天全是今天，MM-DD 无信息量，HH:MM 才看得出先后）
  //   ② 不再挂来源刊名（刊名已上提到分组头，逐条重复是噪音）
  function todayRow(a) {
    var u = safeUrl(a.url);
    var t = u
      ? '<a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(a.title) + '</a>'
      : esc(a.title);
    var vi = a.volume ? '<span class="vi">v' + esc(a.volume) + (a.issue ? 'n' + esc(a.issue) : '') + '</span>' : '';
    var hm = a.obtained_hm
      ? '<span class="hm" title="本地获取时间 ' + esc(a.obtained_at || '') + '">'
        + esc(a.obtained_hm) + '</span>'
      : '';
    var zh = a.title_zh ? '<div class="tzh">' + esc(a.title_zh) + '</div>' : '';
    return '<div class="art">' + hm + '<span class="mk">▸</span><div class="t">' + t + artBtns(a) + zh + '</div>'
      + vi + '</div>';
  }

  // 主题归档条目：分数 + 分档徽章 + 日期 + 卷期页码 + 命中关键词
  function topicRow(a) {
    var u = safeUrl(a.url);
    var t = u
      ? '<a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(a.title) + '</a>'
      : esc(a.title);
    var tier = TIER_LABEL[a.tier] || '一般';
    var meta = ['<span>' + esc(a.date_label) + '</span>'];
    var vi = a.volume ? ('v' + a.volume + (a.issue ? 'n' + a.issue : '')) : '';
    if (vi) meta.push('<span>' + esc(vi) + '</span>');
    if (a.pages) meta.push('<span>' + esc(a.pages) + '</span>');
    if (a.date_basis) meta.push('<span class="k">' + esc(a.date_basis) + '</span>');
    var kws = (a.keywords || []).length
      ? '<div class="kws">' + a.keywords.map(function (k) {
          return '<span class="kw">' + esc(k) + '</span>';
        }).join('') + '</div>'
      : '';
    var zh = a.title_zh ? '<div class="tzh">' + esc(a.title_zh) + '</div>' : '';
    return '<div class="art-w"><span class="sc">' + esc(a.score) + '</span>'
      + '<div class="body"><div>' + t
      + '<span class="t-badge t-' + esc(a.tier) + '">' + esc(tier) + '</span>'
      + artBtns(a) + '</div>' + zh
      + '<div class="meta">' + meta.join('') + '</div>' + kws + '</div></div>';
  }

  function headCard(j) {
    var site = safeUrl(j.website);
    var nameHtml = site
      ? '<a class="c-name" href="' + esc(site) + '" target="_blank" rel="noopener" title="打开期刊首页">' + esc(j.name) + '</a>'
      : '<div class="c-name">' + esc(j.name) + '</div>';
    var sub = [];
    if (j.name_cn && j.name_cn !== j.name) sub.push(j.name_cn);
    if (j.name_en && j.name_en !== j.name) sub.push(j.name_en);
    if (j.short_name) sub.push(j.short_name);
    var chips = [];
    // 「今日 +N」放最前：它就是这张卡被排到区域最前面的原因，要一眼看见。
    // 只在「近 60 天」视图挂 —— 归档视图走发表日期口径，跟「今日获取」不是一回事。
    if (VIEW === 'latest' && j.has_today) {
      chips.push('<span class="chip chip-today">今日 +' + (j.today_count || 1) + '</span>');
    }
    if (j.category) chips.push('<span class="chip">' + esc(j.category) + '</span>');
    (j.level || []).slice(0, 3).forEach(function (l) {
      chips.push('<span class="chip">' + esc(l) + '</span>');
    });
    if (j.frequency) chips.push('<span class="chip">' + esc(j.frequency) + '</span>');
    var foot = [];
    if (site) foot.push('<a href="' + esc(site) + '" target="_blank" rel="noopener">期刊首页 &rarr;</a>');
    var doc = safeUrl(j.doc_url);
    if (doc) foot.push('<a href="' + esc(doc) + '" target="_blank" rel="noopener">飞书速递 &rarr;</a>');
    if (j.site_host) foot.push('<span class="host">' + esc(j.site_host) + '</span>');
    if (j.publisher) foot.push('<span class="sep">|</span><span>' + esc(j.publisher) + '</span>');
    return {
      nameHtml: nameHtml, sub: sub, chips: chips, foot: foot,
      site: site, hasNew: !!j.article_total
    };
  }

  // 近 60 天卡片：只展示「本地近 60 天获取到」的链接，按获取时间倒序
  function cardLatest(j) {
    var h = headCard(j);
    var total = j.article_total || 0;
    var items = j.articles || [];
    var isOpen = !!EXPANDED[j.id] || !!j._force;   // 搜索时铺开全部匹配项
    var shown = isOpen ? items : items.slice(0, PREVIEW_N);
    var win = DATA.window || {};
    var days = win.days || 60;
    var searching = !!Q.trim();

    var badge;
    if (searching) {
      badge = total
        ? '<span class="c-badge">' + total + ' 篇匹配</span>'
        : '<span class="c-badge none">无匹配</span>';
    } else {
      badge = total
        ? '<span class="c-badge">' + days + ' 天内 ' + total + ' 篇</span>'
        : '<span class="c-badge none">' + days + ' 天内无</span>';
    }

    var arts;
    if (shown.length) {
      arts = shown.map(artRow).join('');
      var mk = function (label) {
        return '<a class="more" data-more="' + esc(j.id) + '" href="javascript:void(0)">'
          + label + '</a>';
      };
      if (!isOpen && total > shown.length) {
        arts += mk('展开其余 ' + (total - shown.length) + ' 篇 ↓');
      } else if (isOpen && total > PREVIEW_N) {
        arts += mk('收起 ↑');
      }
      if (total > items.length) {
        arts += '<div class="none-tip">另有 ' + (total - items.length) + ' 篇超出单卡展示上限</div>';
      }
    } else {
      arts = '<div class="none-tip">近 ' + days + ' 天未获取到该刊文章，'
        + '可点击期刊名前往官网查看最新目录</div>';
    }
    return '<div class="card' + (h.hasNew ? ' has-new' : '') + '">'
      + '<div class="c-top"><div>' + h.nameHtml
      + (h.sub.length ? '<div class="c-sub">' + esc(h.sub.join(' · ')) + '</div>' : '')
      + '</div>' + badge + '</div>'
      + (h.chips.length ? '<div class="chips">' + h.chips.join('') + '</div>' : '')
      + '<div class="arts">' + arts + '</div>'
      + '<div class="c-foot">' + h.foot.join('<span class="sep">|</span>') + '</div>'
      + '</div>';
  }

  function cardTopic(j) {
    var h = headCard(j);
    var tiers = j.topic_tiers || {};
    var parts = [];
    ['strong', 'mid', 'low'].forEach(function (k) {
      if (tiers[k]) parts.push(TIER_LABEL[k] + ' ' + tiers[k]);
    });
    var badge = j.topic_total
      ? '<span class="c-badge topic">' + j.topic_total + ' 篇命中</span>'
      : '<span class="c-badge topic none">无命中</span>';
    var arts;
    if (j.topic_articles && j.topic_articles.length) {
      arts = j.topic_articles.map(topicRow).join('');
      if (j.topic_total > j.topic_articles.length) {
        arts += '<div class="none-tip">另有 ' + (j.topic_total - j.topic_articles.length) + ' 篇未展开</div>';
      }
    } else {
      arts = '<div class="none-tip">近 2 个月该刊无与 filter 主题相关的命中文献</div>';
    }
    var sub2 = h.sub.length ? esc(h.sub.join(' · ')) + (parts.length ? ' · ' : '') : '';
    return '<div class="card' + (j.topic_total ? ' has-new' : '') + '">'
      + '<div class="c-top"><div>' + h.nameHtml
      + '<div class="c-sub">' + sub2 + (parts.length ? esc(parts.join(' / ')) : '') + '</div>'
      + '</div>' + badge + '</div>'
      + (h.chips.length ? '<div class="chips">' + h.chips.join('') + '</div>' : '')
      + '<div class="arts">' + arts + '</div>'
      + '<div class="c-foot">' + h.foot.join('<span class="sep">|</span>') + '</div>'
      + '</div>';
  }

  // 「今日更新」板块（页顶）：把当天获取到的文章跨刊汇总。
  // 判据与下方完全同源 —— 都是「本地获取时间」，由服务端按当天日期切好，
  // 前端只负责按区域/搜索过滤后渲染，不自己算日期（避免时区与口径分歧）。
  // 只在「近 60 天」视图出现：主题归档是另一套数据（发表日期口径），混进来会误导。
  //
  // 排版：**按刊分组**，一组一个刊 ——
  //   组头   = 刊名（可点进官网）+ 区域标 + 「N 篇」
  //   组内   = 逐条时间线，按获取时刻倒序
  //   组的先后 = 该刊当天最新一条的获取时刻（越新越靠前）
  // 为什么不全平铺：当天条目可能是几十条跨十几个刊，平铺就是一面墙，
  // 看不出「今天哪些刊有动静」；分组后一眼扫完刊名即可决定要不要展开细看。
  function renderToday() {
    if (!todayEl) return;
    var t = DATA && DATA.today;
    if (VIEW !== 'latest' || !t || !t.total) {
      todayEl.hidden = true; todayEl.innerHTML = ''; return;
    }
    var q = Q.trim().toLowerCase();
    var items = (t.items || []).filter(function (a) {
      if (REGION !== 'all' && a.region !== REGION) return false;
      if (!q) return true;
      return ((a.title || '') + ' ' + (a.title_zh || '')).toLowerCase().indexOf(q) >= 0;
    });
    if (!items.length) { todayEl.hidden = true; todayEl.innerHTML = ''; return; }

    // 聚合：顺序即「该刊首次出现的先后」，随后统一按 newest 重排（见下）。
    var groups = [], idx = {};
    items.forEach(function (a) {
      var k = a.journal || '（未标注来源）';
      var g = idx[k];
      if (!g) {
        g = idx[k] = { name: k, url: '', region: '', items: [], newest: 0 };
        groups.push(g);
      }
      if (!g.url && a.journal_url) g.url = a.journal_url;
      if (!g.region && a.region) g.region = a.region;
      g.items.push(a);
      if ((a.obtained_ts || 0) > g.newest) g.newest = a.obtained_ts || 0;
    });
    groups.forEach(function (g) {
      g.items.sort(function (x, y) { return (y.obtained_ts || 0) - (x.obtained_ts || 0); });
    });
    groups.sort(function (x, y) { return y.newest - x.newest; });

    var head = '<div class="today-head"><div>'
      + '<div class="today-title">今日更新'
      + '<span class="today-date">' + esc(t.date) + '</span></div>'
      + '<div class="today-tip">本机当日获取到的文章链接 · 按刊分组、组内按获取时间倒序'
      + ' · 与下方「近 60 天」同源同口径</div>'
      + '</div><span class="c-badge">' + items.length + ' 篇 · ' + groups.length + ' 种期刊</span></div>';

    var body = groups.map(function (g) {
      var u = safeUrl(g.url);
      var name = u
        ? '<a class="tg-name" href="' + esc(u) + '" target="_blank" rel="noopener"'
          + ' title="打开期刊首页">' + esc(g.name) + '</a>'
        : '<span class="tg-name">' + esc(g.name) + '</span>';
      var region = g.region ? '<span class="tg-region">' + esc(g.region) + '</span>' : '';
      return '<div class="tgroup"><div class="tg-head">' + name + region
        + '<span class="tg-n">' + g.items.length + ' 篇</span></div>'
        + '<div class="arts">' + g.items.map(todayRow).join('') + '</div></div>';
    }).join('');

    if (t.hidden) {
      body += '<div class="none-tip">另有 ' + t.hidden + ' 篇超出单日展示上限</div>';
    }
    todayEl.innerHTML = '<div class="today">' + head + body + '</div>';
    todayEl.hidden = false;
  }

  function render() {
    var q = Q.trim();
    var html = '', shown = 0, matched = 0;
    DATA.groups.forEach(function (g) {
      if (REGION !== 'all' && g.region !== REGION) return;
      var js = g.journals;
      if (VIEW === 'topic' && !q) {
        js = js.filter(function (j) { return j.topic_total > 0; });
      }
      // 搜索：先按查询过滤每卡片，再剔除非空卡片
      if (q) {
        js = js.map(applyQuery).filter(function (j) {
          return VIEW === 'topic'
            ? (j.topic_articles || []).length > 0
            : (j.articles || []).length > 0;
        });
      }
      if (!js.length) return;
      shown += js.length;
      if (q) {
        matched += (VIEW === 'topic'
          ? js.reduce(function (s, j) { return s + (j.topic_articles || []).length; }, 0)
          : js.reduce(function (s, j) { return s + (j.articles || []).length; }, 0));
      }
      var label = VIEW === 'topic'
        ? esc(g.region) + '期刊 · 有主题命中'
        : esc(g.region) + '期刊';
      html += '<div class="grp-t"><span>' + label + '</span><span>' + js.length + ' 种</span></div>';
      html += '<div class="grid">'
        + js.map(VIEW === 'topic' ? cardTopic : cardLatest).join('') + '</div>';
    });
    if (!html) {
      if (q) {
        html = '<div class="loading">没有匹配「' + esc(q) + '」的'
          + (VIEW === 'topic' ? '主题命中文献' : '文章') + '</div>';
      } else {
        html = '<div class="loading">' + (VIEW === 'topic'
          ? '暂无主题归档数据（先运行 journal_backfill.py 生成 journal_topic_archive.json）'
          : '该分类下没有期刊') + '</div>';
      }
    }
    body.innerHTML = html;
    renderToday();     // 页顶「今日更新」跟着一起重绘（所有调用方都走这里）
    MATCHED = matched;
    return shown;
  }

  function updateSummary() {
    var t = DATA.topic || {};
    var w = DATA.window || {};
    if (Q.trim()) {
      sum.innerHTML = '搜索「<b>' + esc(Q.trim()) + '</b>」匹配 <b>' + MATCHED + '</b> 条'
        + (VIEW === 'topic' ? ' 主题文献' : ' 文章');
      syncAllBtn();
      return;
    }
    if (VIEW === 'latest') {
      sum.innerHTML = '共 <b>' + DATA.total_journals + '</b> 种 · 近 <b>'
        + (w.days || 60) + '</b> 天有获取 <b>' + DATA.updated_journals
        + '</b> 种 · 链接 <b>' + DATA.total_articles + '</b> 条';
      vnote.innerHTML = '获取窗口 ' + esc(w.from || '—') + ' ~ ' + esc(w.to || '—')
        + '（本地时间）'
        + '<br>' + (w.ledger_available
          ? '获取台账已建立 · ' + esc(w.ledger_updated_at || '—')
          : '获取台账缺失，暂按文件写入时间兜底');
      legend.innerHTML = '';
    } else {
      sum.innerHTML = '归档命中 <b>' + t.total + '</b> 篇 · 覆盖 <b>'
        + t.journals_with_hits + '</b> 种期刊 · 阈值 score ≥ <b>' + (t.min_score == null ? 8 : t.min_score) + '</b>';
      vnote.innerHTML = t.available
        ? ('时间窗 ' + esc(t.window_from) + ' ~ ' + esc(t.window_to)
           + '<br>生成于 ' + esc(t.generated_at || '—'))
        : '暂无归档，请先运行 journal_backfill.py';
      var lgd = '<div class="legend" style="margin-bottom:18px">'
        + '<span>相关度分档</span>'
        + '<span class="t-badge t-strong">强相关 ≥19</span>'
        + '<span class="t-badge t-mid">相关 12–18</span>'
        + '<span class="t-badge t-low">一般 8–11</span>'
        + '<span>· 括号内数字为相关度得分，日期标 ≈ 者由卷期推算</span>'
        + '</div>';
      legend.innerHTML = lgd;
    }
    syncAllBtn();
  }

  function draw() { render(); updateSummary(); }

  fetch('/api/journals/list', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      DATA = d;
      st.textContent = d.total_journals + ' 种期刊';
      draw();
    })
    .catch(function () {
      body.innerHTML = '<div class="loading">读取期刊数据失败</div>';
      st.textContent = '读取失败';
    });

  bar.addEventListener('click', function (e) {
    var t = e.target.closest('.tab');
    if (!t || !DATA) return;
    Array.prototype.forEach.call(bar.querySelectorAll('.tab'), function (x) { x.classList.remove('on'); });
    t.classList.add('on');
    REGION = t.getAttribute('data-region');
    display();
  });

  // 全站搜索：输入即过滤（标题 + 中文小字 + 主题命中词），不区分视图
  var searchEl = document.getElementById('search');
  var clrEl = document.getElementById('clr');
  function onSearch() {
    if (!DATA) return;
    Q = searchEl.value || '';
    clrEl.hidden = !Q;
    render();
    updateSummary();
  }
  searchEl.addEventListener('input', onSearch);
  clrEl.addEventListener('click', function () {
    searchEl.value = ''; Q = '';
    clrEl.hidden = true;
    render();
    updateSummary();
    try { searchEl.focus(); } catch (e) {}
  });

  // 「全部展开 / 收起全部」——把当前视图里所有被折叠的卡片一次铺开。
  // 只在「近 60 天」视图出现：该视图的条目全部随载荷下发，能真铺开；
  // 「主题归档」的单卡上限由服务端裁剪，铺开也拿不到更多，故不给按钮。
  function syncAllBtn() {
    if (!allbtn) return;
    if (Q.trim()) { allbtn.hidden = true; return; }   // 搜索时不显示「全部展开」
    var n = 0;
    if (DATA && VIEW === 'latest') {
      DATA.groups.forEach(function (g) {
        if (REGION !== 'all' && g.region !== REGION) return;
        (g.journals || []).forEach(function (j) {
          if ((j.article_total || 0) > PREVIEW_N) n++;
        });
      });
    }
    allbtn.hidden = !n;
    allbtn.textContent = ALL_OPEN ? '收起全部 ↑' : '全部展开 ↓';
    allbtn.title = n
      ? (ALL_OPEN ? '收起 ' + n + ' 张卡片中已铺开的条目' : '把 ' + n + ' 张卡片中折叠的条目全部展开')
      : '';
  }

  allbtn.addEventListener('click', function () {
    if (!DATA) return;
    ALL_OPEN = !ALL_OPEN;
    EXPANDED = {};
    if (ALL_OPEN) {
      DATA.groups.forEach(function (g) {
        if (REGION !== 'all' && g.region !== REGION) return;
        (g.journals || []).forEach(function (j) {
          if ((j.article_total || 0) > PREVIEW_N) EXPANDED[j.id] = 1;
        });
      });
    }
    syncAllBtn();
    render();
  });

  // 卡片内「展开其余 N 篇 / 收起」——用事件委托，因为卡片整体会被重渲染
  body.addEventListener('click', function (e) {
    var a = (e.target && e.target.closest) ? e.target.closest('.more') : null;
    if (!a) return;
    var id = a.getAttribute('data-more');
    if (!id) return;
    if (EXPANDED[id]) { delete EXPANDED[id]; } else { EXPANDED[id] = 1; }
    ALL_OPEN = false;   // 逐卡操作后总开关状态不再成立
    syncAllBtn();
    render();   // 只重绘卡片列表，不动汇总行、不滚动页面
  });

  document.querySelector('.vbar').addEventListener('click', function (e) {
    var t = e.target.closest('.vtab');
    if (!t || !DATA) return;
    Array.prototype.forEach.call(document.querySelectorAll('.vtab'), function (x) { x.classList.remove('on'); });
    t.classList.add('on');
    VIEW = t.getAttribute('data-view');
    display();
  });

  function display() {
    body.innerHTML = '<div class="loading">加载中…</div>';
    draw();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
})();
</script>

<!-- 三按钮交互（2026-10-17）
     语义分工（用户确认）：
       · 「下载 PDF」= NAS → 用户本地。已归档的条目后端注入 archived/pdf_rel/eid，
         按钮点开版本菜单（原文 / 中文版 / 双语对照版），走 <a download> 直落本地。
       · 「在线抓取」= 网站 → NAS 补抓通道，仅在每日管线尚未归档该篇时出现：
         POST /api/journals/fetch-pdf → handler 集下载 → NAS 落盘
         → 题录条目（extraction: manual）→ index_one_entry.py 增量索引（5556 秒级可查）
         成功后按钮就地转为「下载 PDF ▾」，阅读/翻译同时解锁。
     幂等：重复抓取后端返回 existed=true，前端同样解锁、不重复写盘。 -->
<script>
(function () {
  'use strict';
  var ICON_DL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2 2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';

  // 事件委托：卡片整体会被重渲染（搜索/切视图/展开），逐元素绑定会漏。
  // 源站状态码 → 人话（handler 已精确区分，别再一律显示"下载失败"）。
  var ERR_HINT = {
    no_fulltext: '源站暂未上传全文（非下载问题），可稍后再试或到期刊官网手动下载',
    not_pdf: '源站返回内容不是 PDF（可能触发反爬限制），可稍后再试',
    not_pdf_office: '源站仅提供 Office 排版稿，没有 PDF 版',
    err_parse: '未能解析出 PDF 直链（页面结构可能已变化）',
    err_network: '网络错误，请稍后重试'
  };

  document.addEventListener('click', function (e) {
    if (!e.target || !e.target.closest) return;
    // 点菜单外部 / 按 Esc → 关闭版本浮层
    var open = document.querySelector('.j-ver:not([hidden])');
    if (open && !e.target.closest('.j-ver') && !e.target.closest('.j-dl')) closeVer();
    var item = e.target.closest('.j-ver-i');
    if (item) { e.preventDefault(); closeVer(); saveFile(item); return; }
    var dl = e.target.closest('.j-dl');
    if (dl) {
      if (dl.disabled) return;
      // j-dl-ready（已归档）→ 弹版本菜单：NAS → 用户本地
      // j-dl-grab（未归档）→ 走补抓通道：网站 → NAS
      if (dl.classList.contains('j-dl-ready')
          || dl.classList.contains('j-dl-done')) openVer(dl);
      else onGrab(dl);
      return;
    }
    var rd = e.target.closest('.j-read');
    if (rd && rd.classList.contains('is-off')) {
      e.preventDefault();
      alert('请先点击「下载 PDF」：原文保存到 NAS 论文仓库后即可在线阅读。');
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeVer();
  });
  window.addEventListener('resize', closeVer);

  // ── 版本选择浮层 ───────────────────────────────────────────
  // 原文（始终可下）+ 中文版/双语对照版（译文就绪才可下）。
  // 译文地址走 5556 代理 /geokb/pdf/<eid>/<variant>，由后端读 SQLite 定位 NAS 文件。
  var VER_ICON = {
    orig: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>',
    mono: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16M4 10h10M4 15h13M4 20h8"/></svg>',
    dual:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="18"/><rect x="13" y="3" width="8" height="18"/></svg>'
  };

  function fmtSize(n) {
    if (!n) return '';
    return n >= 1048576 ? (n / 1048576).toFixed(1) + 'M'
                       : Math.round(n / 1024) + 'K';
  }

  // 从后端查译文状态（has_mono / has_dual），供菜单决定哪些项可下
  function fetchTrans(eid) {
    if (!eid) return Promise.resolve({});
    return fetch('/geokb/api/entry/' + encodeURIComponent(eid) + '/translation',
                 { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) { return (d && d.ok) ? d : {}; })
      .catch(function () { return {}; });
  }

  // Windows 文件名非法字符（含全角冒号「：」——论文标题里真实出现过）
  function safeName(s, max) {
    return String(s == null ? '' : s)
      .replace(/[\\/:*?"<>|]/g, '_')
      .replace(/[：]/g, '_')
      .replace(/\s+/g, ' ')
      .trim()
      .slice(0, max || 100);
  }

  function openVer(btn) {
    closeVer();
    var eid = btn.getAttribute('data-eid') || '';
    // 原文地址：优先后端注入的 pdf_rel（回源 NAS），兼容补抓后写上的 pdf-url
    var rel = btn.getAttribute('data-pdf-rel') || '';
    var origUrl = rel
      ? '/api/journals/pdf/' + rel.split('/').map(encodeURIComponent).join('/')
      : (btn.getAttribute('data-pdf-url') || '');
    var origName = safeName(decodeURIComponent(
      (origUrl.split('/').pop() || 'paper.pdf').replace(/%[0-9A-Fa-f]{2}/g,
        function (h) { try { return decodeURIComponent(h); } catch (e) { return h; } })));
    var monoUrl = eid ? '/geokb/pdf/' + encodeURIComponent(eid) + '/mono' : '';
    var dualUrl = eid ? '/geokb/pdf/' + encodeURIComponent(eid) + '/dual' : '';
    var base = origName.replace(/\.pdf$/i, '');

    var menu = document.createElement('div');
    menu.className = 'j-ver';
    menu.innerHTML = '<div class="j-ver-hd">从 NAS 下载到本地</div>'
      + verItem('orig', '原文 PDF', origUrl, origName, !!origUrl)
      + verItem('mono', '中文版', monoUrl, base + '.zh.mono.pdf', false)
      + verItem('dual', '双语对照版', dualUrl, base + '.zh.dual.pdf', false);
    document.body.appendChild(menu);

    // 定位到按钮下方右对齐；越界则翻到上方
    var r = btn.getBoundingClientRect();
    var mw = menu.offsetWidth, mh = menu.offsetHeight;
    var left = Math.min(r.right - mw, window.innerWidth - mw - 8);
    left = Math.max(8, left);
    var top = r.bottom + 4;
    if (top + mh > window.innerHeight - 8) top = Math.max(8, r.top - mh - 4);
    menu.style.left = (left + window.scrollX) + 'px';
    menu.style.top = (top + window.scrollY) + 'px';

    // 译文就绪才解禁对应项（tag 也从「翻译后可下」切成「PDF」）
    fetchTrans(eid).then(function (info) {
      var items = menu.querySelectorAll('.j-ver-i');
      [[items[1], info.has_mono], [items[2], info.has_dual || info.has_mono]]
        .forEach(function (pair) {
          var it = pair[0], ok = !!pair[1];
          it.disabled = !ok;
          if (ok) {
            var t = it.querySelector('.tag');
            if (t) t.textContent = 'PDF';
          }
        });
    });
  }

  // 本 IIFE 独立作用域，esc 定义在页面主 IIFE 里，用不了，这里就地转义
  function escAttr(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function verItem(key, label, url, filename, ready) {
    return '<button type="button" class="j-ver-i" data-key="' + key + '"'
      + ' data-url="' + escAttr(url) + '" data-name="' + escAttr(filename) + '"'
      + (ready ? '' : ' disabled') + '>'
      + VER_ICON[key] + '<span>' + label + '</span>'
      + '<span class="tag">' + (ready ? 'PDF' : '翻译后可下') + '</span>'
      + '</button>';
  }

  function closeVer() {
    var m = document.querySelector('.j-ver');
    if (m) m.remove();
  }

  // 走同源地址下载（浏览器按 Content-Disposition 落盘），不用 fetch 攒 blob
  function saveFile(item) {
    var url = item.getAttribute('data-url') || '';
    var name = item.getAttribute('data-name') || 'paper.pdf';
    if (!url) return;
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  // 「在线抓取」：网站 → NAS 补抓通道（正常由每日管线自动完成，此处仅兜底）。
  function onGrab(btn) {
    if (btn.disabled) return;
    var orig = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="j-spin"></span><span>抓取中…</span>';
    fetch('/api/journals/fetch-pdf', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        journal: btn.getAttribute('data-journal') || '',
        title: btn.getAttribute('data-title') || '',
        url: btn.getAttribute('data-url') || ''
      })
    })
      .then(function (r) {
        return r.json().then(function (d) { return { code: r.status, body: d }; });
      })
      .then(function (res) {
        var d = res.body || {};
        if (res.code === 200 && d.ok) {
          unlock(btn, d);
        } else {
          btn.disabled = false;
          btn.innerHTML = orig;
          alert((ERR_HINT[d.error] || d.message || '抓取失败')
                + '（HTTP ' + res.code + '）');
        }
      })
      .catch(function (err) {
        btn.disabled = false;
        btn.innerHTML = orig;
        alert('网络错误：' + err);
      });
  }

  function unlock(btn, d) {
    // ① 抓取钮 → 「下载 PDF ▾」（NAS→用户，点开选版本）
    btn.classList.remove('j-dl-grab');
    btn.classList.add('j-dl-ready');
    btn.innerHTML = ICON_DL + '<span>下载 PDF</span>';
    btn.title = 'PDF 已存 NAS 论文仓库'
      + (d.existed ? '（此前已归档）' : '')
      + (d.entry_created ? '，已建档题录条目' : '')
      + (d.indexed ? '，已入检索索引' : '，索引未完成（不影响阅读）')
      + '；点击选择下载版本';
    btn.setAttribute('data-eid', d.eid || '');
    btn.setAttribute('data-pdf-rel', d.pdf_rel || '');
    btn.disabled = false;            // 恢复可点：用于打开版本选择菜单

    // ② 阅读钮 → 解锁（原文；译文就绪后 geokb_translate.js 自动切双语对照）
    var row = btn.closest('.art') || btn.closest('.art-w');
    var title = btn.getAttribute('data-title') || '';
    var rd = row && row.querySelector('.j-read');
    if (rd) {
      var single = '/PDFreader?file=' + encodeURIComponent(d.pdf_url || '')
        + '&title=' + encodeURIComponent(title);
      var pair = single + '&peer='
        + encodeURIComponent('/geokb/pdf/' + (d.eid || '') + '/mono')
        + '&layout=continuous&sync=1';
      rd.classList.remove('is-off');
      rd.removeAttribute('aria-disabled');
      rd.setAttribute('href', single);
      rd.setAttribute('data-read-link', '');
      rd.setAttribute('data-read-eid', d.eid || '');
      rd.setAttribute('data-read-single', single);
      rd.setAttribute('data-read-pair', pair);
      rd.title = '自研 canvas 阅读器打开：不依赖浏览器 PDF 插件';
    }

    // ③ 翻译钮 → 解锁并挂 eid（提交 / 轮询 / 状态机在 geokb_translate.js）
    var tr = row && row.querySelector('.j-tr');
    if (tr) {
      tr.removeAttribute('disabled');
      tr.setAttribute('data-eid', d.eid || '');
      tr.title = '提交 NAS 原文到翻译队列，完成后译文归档到原文同目录';
    }
  }
})();
</script>

</body>
</html>
