    } else {
      var ta = (j.topic_articles || []).filter(function (a) {
        return (a.title || '').toLowerCase().indexOf(q) >= 0
          || (a.title_zh || '').toLowerCase().indexOf(q) >= 0
          || (a.keywords || []).join(' ').toLowerCase().indexOf(q) >= 0
          || (a.date_label || '').toLowerCase().indexOf(q) >= 0;
      });
      c.topic_articles = ta;
      c.topic_total = ta.length;
    }
    return c;
  }

  // 近 60 天条目：标题 + 本地获取日期（MM-DD）+ 卷期
  // ★ 形参只能有一个：下面是 `shown.map(artRow)`，map 会把「下标」当第二个实参传进来。
  //   曾因签名写成 artRow(a, jname) 而把下标当刊名渲染，卡片里凭空冒出 1/2/3/4/5 灰字。
  function artRow(a) {
    var u = safeUrl(a.url);
    var t = u
      ? '<a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(a.title) + '</a>'
      : esc(a.title);
    var vi = a.volume ? '<span class="vi">v' + esc(a.volume) + (a.issue ? 'n' + esc(a.issue) : '') + '</span>' : '';
    var ob = a.obtained_label
      ? '<span class="ob" title="本地获取时间 ' + esc(a.obtained_at || a.obtained_label) + '">'
        + esc(a.obtained_label) + '</span>'
      : '';
    // 英文条目下方挂中文小字（离线预翻译，没有就不显示，绝不占位）
    var zh = a.title_zh ? '<div class="tzh">' + esc(a.title_zh) + '</div>' : '';
    return '<div class="art"><span class="mk">▸</span><div class="t">' + t + zh + '</div>'
      + ob + vi + '</div>';
  }

  // 今日条目：同为一条 .art（样式与下方卡片完全一致），两处与 artRow 不同 ——
  //   ① 日期换成**时刻**（当天全是今天，MM-DD 无信息量，HH:MM 才看得出先后）
  //   ② 不再挂来源刊名（刊名已上提到分组头，逐条重复是噪音）
  function todayRow(a) {
    var u = safeUrl(a.url);
    var t = u
      ? '<a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(a.title) + '</a>'
      : esc(a.title);
    var vi = a.volume ? '<span class="vi">v' + esc(a.volume) + (a.issue ? 'n' + esc(a.issue) : '') + '</span>' : '';
    var hm = a.obtained_hm
      ? '<span class="hm" title="本地获取时间 ' + esc(a.obtained_at || '') + '">'
        + esc(a.obtained_hm) + '</span>'
      : '';
    var zh = a.title_zh ? '<div class="tzh">' + esc(a.title_zh) + '</div>' : '';
    return '<div class="art">' + hm + '<span class="mk">▸</span><div class="t">' + t + zh + '</div>'
      + vi + '</div>';
  }

  // 主题归档条目：分数 + 分档徽章 + 日期 + 卷期页码 + 命中关键词
  function topicRow(a) {
    var u = safeUrl(a.url);
    var t = u
      ? '<a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(a.title) + '</a>'
      : esc(a.title);
    var tier = TIER_LABEL[a.tier] || '一般';
    var meta = ['<span>' + esc(a.date_label) + '</span>'];
    var vi = a.volume ? ('v' + a.volume + (a.issue ? 'n' + a.issue : '')) : '';
    if (vi) meta.push('<span>' + esc(vi) + '</span>');
    if (a.pages) meta.push('<span>' + esc(a.pages) + '</span>');
    if (a.date_basis) meta.push('<span class="k">' + esc(a.date_basis) + '</span>');
    var kws = (a.keywords || []).length
      ? '<div class="kws">' + a.keywords.map(function (k) {
          return '<span class="kw">' + esc(k) + '</span>';
        }).join('') + '</div>'
      : '';
    var zh = a.title_zh ? '<div class="tzh">' + esc(a.title_zh) + '</div>' : '';
    return '<div class="art-w"><span class="sc">' + esc(a.score) + '</span>'
      + '<div class="body"><div>' + t
      + '<span class="t-badge t-' + esc(a.tier) + '">' + esc(tier) + '</span></div>' + zh
      + '<div class="meta">' + meta.join('') + '</div>' + kws + '</div></div>';
  }

  function headCard(j) {
    var site = safeUrl(j.website);
    var nameHtml = site
      ? '<a class="c-name" href="' + esc(site) + '" target="_blank" rel="noopener" title="打开期刊首页">' + esc(j.name) + '</a>'
      : '<div class="c-name">' + esc(j.name) + '</div>';
    var sub = [];
    if (j.name_cn && j.name_cn !== j.name) sub.push(j.name_cn);
    if (j.name_en && j.name_en !== j.name) sub.push(j.name_en);
    if (j.short_name) sub.push(j.short_name);
    var chips = [];
    // 「今日 +N」放最前：它就是这张卡被排到区域最前面的原因，要一眼看见。
    // 只在「近 60 天」视图挂 —— 归档视图走发表日期口径，跟「今日获取」不是一回事。
    if (VIEW === 'latest' && j.has_today) {
      chips.push('<span class="chip chip-today">今日 +' + (j.today_count || 1) + '</span>');
    }
    if (j.category) chips.push('<span class="chip">' + esc(j.category) + '</span>');
    (j.level || []).slice(0, 3).forEach(function (l) {
      chips.push('<span class="chip">' + esc(l) + '</span>');
    });
    if (j.frequency) chips.push('<span class="chip">' + esc(j.frequency) + '</span>');
    var foot = [];
    if (site) foot.push('<a href="' + esc(site) + '" target="_blank" rel="noopener">期刊首页 &rarr;</a>');
    var doc = safeUrl(j.doc_url);
    if (doc) foot.push('<a href="' + esc(doc) + '" target="_blank" rel="noopener">飞书速递 &rarr;</a>');
    if (j.site_host) foot.push('<span class="host">' + esc(j.site_host) + '</span>');
    if (j.publisher) foot.push('<span class="sep">|</span><span>' + esc(j.publisher) + '</span>');
    return {
      nameHtml: nameHtml, sub: sub, chips: chips, foot: foot,
      site: site, hasNew: !!j.article_total
    };
  }

  // 近 60 天卡片：只展示「本地近 60 天获取到」的链接，按获取时间倒序
  function cardLatest(j) {
    var h = headCard(j);
    var total = j.article_total || 0;
    var items = j.articles || [];
    var isOpen = !!EXPANDED[j.id] || !!j._force;   // 搜索时铺开全部匹配项
    var shown = isOpen ? items : items.slice(0, PREVIEW_N);
    var win = DATA.window || {};
    var days = win.days || 60;
    var searching = !!Q.trim();

    var badge;
    if (searching) {
      badge = total
        ? '<span class="c-badge">' + total + ' 篇匹配</span>'
        : '<span class="c-badge none">无匹配</span>';
    } else {
      badge = total
        ? '<span class="c-badge">' + days + ' 天内 ' + total + ' 篇</span>'
        : '<span class="c-badge none">' + days + ' 天内无</span>';
    }

    var arts;
    if (shown.length) {
      arts = shown.map(artRow).join('');
      var mk = function (label) {
        return '<a class="more" data-more="' + esc(j.id) + '" href="javascript:void(0)">'
          + label + '</a>';
      };
      if (!isOpen && total > shown.length) {
        arts += mk('展开其余 ' + (total - shown.length) + ' 篇 ↓');
      } else if (isOpen && total > PREVIEW_N) {
        arts += mk('收起 ↑');
      }
      if (total > items.length) {
        arts += '<div class="none-tip">另有 ' + (total - items.length) + ' 篇超出单卡展示上限</div>';
      }
    } else {
      arts = '<div class="none-tip">近 ' + days + ' 天未获取到该刊文章，'
        + '可点击期刊名前往官网查看最新目录</div>';
    }
    return '<div class="card' + (h.hasNew ? ' has-new' : '') + '">'
      + '<div class="c-top"><div>' + h.nameHtml
      + (h.sub.length ? '<div class="c-sub">' + esc(h.sub.join(' · ')) + '</div>' : '')
      + '</div>' + badge + '</div>'
      + (h.chips.length ? '<div class="chips">' + h.chips.join('') + '</div>' : '')
      + '<div class="arts">' + arts + '</div>'
      + '<div class="c-foot">' + h.foot.join('<span class="sep">|</span>') + '</div>'
      + '</div>';
  }

  function cardTopic(j) {
    var h = headCard(j);
    var tiers = j.topic_tiers || {};
    var parts = [];
    ['strong', 'mid', 'low'].forEach(function (k) {
      if (tiers[k]) parts.push(TIER_LABEL[k] + ' ' + tiers[k]);
    });
    var badge = j.topic_total
      ? '<span class="c-badge topic">' + j.topic_total + ' 篇命中</span>'
      : '<span class="c-badge topic none">无命中</span>';
    var arts;
    if (j.topic_articles && j.topic_articles.length) {
      arts = j.topic_articles.map(topicRow).join('');
      if (j.topic_total > j.topic_articles.length) {
        arts += '<div class="none-tip">另有 ' + (j.topic_total - j.topic_articles.length) + ' 篇未展开</div>';
      }
    } else {
      arts = '<div class="none-tip">近 2 个月该刊无与 filter 主题相关的命中文献</div>';
    }
    var sub2 = h.sub.length ? esc(h.sub.join(' · ')) + (parts.length ? ' · ' : '') : '';
    return '<div class="card' + (j.topic_total ? ' has-new' : '') + '">'
      + '<div class="c-top"><div>' + h.nameHtml
      + '<div class="c-sub">' + sub2 + (parts.length ? esc(parts.join(' / ')) : '') + '</div>'
      + '</div>' + badge + '</div>'
      + (h.chips.length ? '<div class="chips">' + h.chips.join('') + '</div>' : '')
      + '<div class="arts">' + arts + '</div>'
      + '<div class="c-foot">' + h.foot.join('<span class="sep">|</span>') + '</div>'
      + '</div>';
  }

  // 「今日更新」板块（页顶）：把当天获取到的文章跨刊汇总。
  // 判据与下方完全同源 —— 都是「本地获取时间」，由服务端按当天日期切好，
  // 前端只负责按区域/搜索过滤后渲染，不自己算日期（避免时区与口径分歧）。
  // 只在「近 60 天」视图出现：主题归档是另一套数据（发表日期口径），混进来会误导。
  //
  // 排版：**按刊分组**，一组一个刊 ——
  //   组头   = 刊名（可点进官网）+ 区域标 + 「N 篇」
  //   组内   = 逐条时间线，按获取时刻倒序
  //   组的先后 = 该刊当天最新一条的获取时刻（越新越靠前）
  // 为什么不全平铺：当天条目可能是几十条跨十几个刊，平铺就是一面墙，
  // 看不出「今天哪些刊有动静」；分组后一眼扫完刊名即可决定要不要展开细看。
  function renderToday() {
    if (!todayEl) return;
    var t = DATA && DATA.today;
    if (VIEW !== 'latest' || !t || !t.total) {
      todayEl.hidden = true; todayEl.innerHTML = ''; return;
    }
    var q = Q.trim().toLowerCase();
    var items = (t.items || []).filter(function (a) {
      if (REGION !== 'all' && a.region !== REGION) return false;
      if (!q) return true;
      return ((a.title || '') + ' ' + (a.title_zh || '')).toLowerCase().indexOf(q) >= 0;
    });
    if (!items.length) { todayEl.hidden = true; todayEl.innerHTML = ''; return; }

    // 聚合：顺序即「该刊首次出现的先后」，随后统一按 newest 重排（见下）。
    var groups = [], idx = {};
    items.forEach(function (a) {
      var k = a.journal || '（未标注来源）';
      var g = idx[k];
      if (!g) {
        g = idx[k] = { name: k, url: '', region: '', items: [], newest: 0 };
        groups.push(g);
      }
      if (!g.url && a.journal_url) g.url = a.journal_url;
      if (!g.region && a.region) g.region = a.region;
      g.items.push(a);
      if ((a.obtained_ts || 0) > g.newest) g.newest = a.obtained_ts || 0;
    });
    groups.forEach(function (g) {
      g.items.sort(function (x, y) { return (y.obtained_ts || 0) - (x.obtained_ts || 0); });
    });
    groups.sort(function (x, y) { return y.newest - x.newest; });

    var head = '<div class="today-head"><div>'
      + '<div class="today-title">今日更新'
      + '<span class="today-date">' + esc(t.date) + '</span></div>'
      + '<div class="today-tip">本机当日获取到的文章链接 · 按刊分组、组内按获取时间倒序'
      + ' · 与下方「近 60 天」同源同口径</div>'
      + '</div><span class="c-badge">' + items.length + ' 篇 · ' + groups.length + ' 种期刊</span></div>';

    var body = groups.map(function (g) {
      var u = safeUrl(g.url);
      var name = u
        ? '<a class="tg-name" href="' + esc(u) + '" target="_blank" rel="noopener"'
          + ' title="打开期刊首页">' + esc(g.name) + '</a>'
        : '<span class="tg-name">' + esc(g.name) + '</span>';
      var region = g.region ? '<span class="tg-region">' + esc(g.region) + '</span>' : '';
      return '<div class="tgroup"><div class="tg-head">' + name + region
        + '<span class="tg-n">' + g.items.length + ' 篇</span></div>'
        + '<div class="arts">' + g.items.map(todayRow).join('') + '</div></div>';
    }).join('');

    if (t.hidden) {
      body += '<div class="none-tip">另有 ' + t.hidden + ' 篇超出单日展示上限</div>';
    }
    todayEl.innerHTML = '<div class="today">' + head + body + '</div>';
    todayEl.hidden = false;
  }

  function render() {
    var q = Q.trim();
    var html = '', shown = 0, matched = 0;
    DATA.groups.forEach(function (g) {
      if (REGION !== 'all' && g.region !== REGION) return;
      var js = g.journals;
      if (VIEW === 'topic' && !q) {
        js = js.filter(function (j) { return j.topic_total > 0; });
      }
      // 搜索：先按查询过滤每卡片，再剔除非空卡片
      if (q) {
        js = js.map(applyQuery).filter(function (j) {
          return VIEW === 'topic'
            ? (j.topic_articles || []).length > 0
            : (j.articles || []).length > 0;
        });
      }
      if (!js.length) return;
      shown += js.length;
      if (q) {
        matched += (VIEW === 'topic'
          ? js.reduce(function (s, j) { return s + (j.topic_articles || []).length; }, 0)
          : js.reduce(function (s, j) { return s + (j.articles || []).length; }, 0));
      }
      var label = VIEW === 'topic'
        ? esc(g.region) + '期刊 · 有主题命中'
        : esc(g.region) + '期刊';
      html += '<div class="grp-t"><span>' + label + '</span><span>' + js.length + ' 种</span></div>';
      html += '<div class="grid">'
        + js.map(VIEW === 'topic' ? cardTopic : cardLatest).join('') + '</div>';
    });
    if (!html) {
      if (q) {
        html = '<div class="loading">没有匹配「' + esc(q) + '」的'
          + (VIEW === 'topic' ? '主题命中文献' : '文章') + '</div>';
      } else {
        html = '<div class="loading">' + (VIEW === 'topic'
          ? '暂无主题归档数据（先运行 journal_backfill.py 生成 journal_topic_archive.json）'
          : '该分类下没有期刊') + '</div>';
      }
    }
    body.innerHTML = html;
    renderToday();     // 页顶「今日更新」跟着一起重绘（所有调用方都走这里）
    MATCHED = matched;
    return shown;
  }

  function updateSummary() {
    var t = DATA.topic || {};
    var w = DATA.window || {};
    if (Q.trim()) {
      sum.innerHTML = '搜索「<b>' + esc(Q.trim()) + '</b>」匹配 <b>' + MATCHED + '</b> 条'
        + (VIEW === 'topic' ? ' 主题文献' : ' 文章');
      syncAllBtn();
      return;
    }
    if (VIEW === 'latest') {
      sum.innerHTML = '共 <b>' + DATA.total_journals + '</b> 种 · 近 <b>'
        + (w.days || 60) + '</b> 天有获取 <b>' + DATA.updated_journals
        + '</b> 种 · 链接 <b>' + DATA.total_articles + '</b> 条';
      vnote.innerHTML = '获取窗口 ' + esc(w.from || '—') + ' ~ ' + esc(w.to || '—')
        + '（本地时间）'
        + '<br>' + (w.ledger_available
          ? '获取台账已建立 · ' + esc(w.ledger_updated_at || '—')
          : '获取台账缺失，暂按文件写入时间兜底');
      legend.innerHTML = '';
    } else {
      sum.innerHTML = '归档命中 <b>' + t.total + '</b> 篇 · 覆盖 <b>'
        + t.journals_with_hits + '</b> 种期刊 · 阈值 score ≥ <b>' + (t.min_score == null ? 8 : t.min_score) + '</b>';
      vnote.innerHTML = t.available
        ? ('时间窗 ' + esc(t.window_from) + ' ~ ' + esc(t.window_to)
           + '<br>生成于 ' + esc(t.generated_at || '—'))
        : '暂无归档，请先运行 journal_backfill.py';
      var lgd = '<div class="legend" style="margin-bottom:18px">'
        + '<span>相关度分档</span>'
        + '<span class="t-badge t-strong">强相关 ≥19</span>'
        + '<span class="t-badge t-mid">相关 12–18</span>'
        + '<span class="t-badge t-low">一般 8–11</span>'
        + '<span>· 括号内数字为相关度得分，日期标 ≈ 者由卷期推算</span>'
        + '</div>';
      legend.innerHTML = lgd;
    }
    syncAllBtn();
  }

  function draw() { render(); updateSummary(); }

  fetch('/api/journals/list', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      DATA = d;
      st.textContent = d.total_journals + ' 种期刊';
      draw();
    })
    .catch(function () {
      body.innerHTML = '<div class="loading">读取期刊数据失败</div>';
      st.textContent = '读取失败';
    });

  bar.addEventListener('click', function (e) {
    var t = e.target.closest('.tab');
    if (!t || !DATA) return;
    Array.prototype.forEach.call(bar.querySelectorAll('.tab'), function (x) { x.classList.remove('on'); });
    t.classList.add('on');
    REGION = t.getAttribute('data-region');
    display();
  });

  // 全站搜索：输入即过滤（标题 + 中文小字 + 主题命中词），不区分视图
  var searchEl = document.getElementById('search');
  var clrEl = document.getElementById('clr');
  function onSearch() {
    if (!DATA) return;
    Q = searchEl.value || '';
    clrEl.hidden = !Q;
    render();
    updateSummary();
  }
  searchEl.addEventListener('input', onSearch);
  clrEl.addEventListener('click', function () {
    searchEl.value = ''; Q = '';
    clrEl.hidden = true;
    render();
    updateSummary();
    try { searchEl.focus(); } catch (e) {}
  });

  // 「全部展开 / 收起全部」——把当前视图里所有被折叠的卡片一次铺开。
  // 只在「近 60 天」视图出现：该视图的条目全部随载荷下发，能真铺开；
  // 「主题归档」的单卡上限由服务端裁剪，铺开也拿不到更多，故不给按钮。
  function syncAllBtn() {
    if (!allbtn) return;
    if (Q.trim()) { allbtn.hidden = true; return; }   // 搜索时不显示「全部展开」
    var n = 0;
    if (DATA && VIEW === 'latest') {
      DATA.groups.forEach(function (g) {
        if (REGION !== 'all' && g.region !== REGION) return;
        (g.journals || []).forEach(function (j) {
          if ((j.article_total || 0) > PREVIEW_N) n++;
        });
      });
    }
    allbtn.hidden = !n;
    allbtn.textContent = ALL_OPEN ? '收起全部 ↑' : '全部展开 ↓';
    allbtn.title = n
      ? (ALL_OPEN ? '收起 ' + n + ' 张卡片中已铺开的条目' : '把 ' + n + ' 张卡片中折叠的条目全部展开')
      : '';
  }

  allbtn.addEventListener('click', function () {
    if (!DATA) return;
    ALL_OPEN = !ALL_OPEN;
    EXPANDED = {};
    if (ALL_OPEN) {
      DATA.groups.forEach(function (g) {
        if (REGION !== 'all' && g.region !== REGION) return;
        (g.journals || []).forEach(function (j) {
          if ((j.article_total || 0) > PREVIEW_N) EXPANDED[j.id] = 1;
        });
      });
    }
    syncAllBtn();
    render();
  });

  // 卡片内「展开其余 N 篇 / 收起」——用事件委托，因为卡片整体会被重渲染
  body.addEventListener('click', function (e) {
    var a = (e.target && e.target.closest) ? e.target.closest('.more') : null;
    if (!a) return;
    var id = a.getAttribute('data-more');
    if (!id) return;
    if (EXPANDED[id]) { delete EXPANDED[id]; } else { EXPANDED[id] = 1; }
    ALL_OPEN = false;   // 逐卡操作后总开关状态不再成立
    syncAllBtn();
    render();   // 只重绘卡片列表，不动汇总行、不滚动页面
  });

  document.querySelector('.vbar').addEventListener('click', function (e) {
    var t = e.target.closest('.vtab');
    if (!t || !DATA) return;
    Array.prototype.forEach.call(document.querySelectorAll('.vtab'), function (x) { x.classList.remove('on'); });
    t.classList.add('on');
    VIEW = t.getAttribute('data-view');
    display();
  });

  function display() {
    body.innerHTML = '<div class="loading">加载中…</div>';
    draw();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
})();
</script>

</body>
</html>
