# GeoKB Supervisor 配置（与 5555 门户、5554 管理端独立）
# 安装位置: C:\ProgramData\supervisor\conf.d\geokb.ini
# 启用: supervisorctl reread && supervisorctl update
#
# 架构说明：
#   - geokb (5556): 面向公网 Agent/AI 的只读 API，监听 0.0.0.0:5556。
#   - geokb-admin (5554): 本地管理端，监听 127.0.0.1:5554，需 token。

[program:geokb]
command=D:/ZSK/geokb/venv/Scripts/python.exe D:/ZSK/geokb/server/app.py
directory=D:/ZSK/geokb
autostart=true
autorestart=true
startsecs=3
startretries=3
stopwaitsecs=10
stdout_logfile=D:/ZSK/geokb/logs/supervisor_stdout.log
stderr_logfile=D:/ZSK/geokb/logs/supervisor_stderr.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
environment=GEOKB_PORT="5556",PYTHONUNBUFFERED="1",GEOKB_HOST="0.0.0.0"

[program:geokb-admin]
command=D:/ZSK/geokb/venv/Scripts/python.exe D:/ZSK/geokb/server/admin/app.py
directory=D:/ZSK/geokb
autostart=true
autorestart=true
startsecs=3
startretries=3
stopwaitsecs=10
stdout_logfile=D:/ZSK/geokb/logs/supervisor_admin_stdout.log
stderr_logfile=D:/ZSK/geokb/logs/supervisor_admin_stderr.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=GEOKB_ADMIN_PORT="5554",PYTHONUNBUFFERED="1",GEOKB_ADMIN_SECRET="geokb-admin-local"
