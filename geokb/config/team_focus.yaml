# 团队研究画像（知识点「可复用性」判据的输入）
#
# 用途：scripts/kp_select.py 用本文件给候选知识点打「团队相关性」分。
#   命中任一板块 → 该维度得分；命中得越多、越具体，分数越高（饱和 3 个）。
#
# 维护：研究方向变化时直接改本文件，**改完立即生效**（无缓存、无需重启）。
#       每项写「规范词 + 同义词/英文/缩写」，用小写英文与中文混合匹配。
#
# 排序即优先级：越靠前越接近团队主线。

commodities:            # 矿种（同一种矿的研究最可直接参考）
  - [W, [钨, 白钨矿, 黑钨矿, 钨矿, scheelite, wolframite, tungsten]]
  - [Sn, [锡, 锡石, cassiterite, tin]]
  - [Mo, [钼, 辉钼矿, molybdenite, molybdenum]]
  - [Cu, [铜, 黄铜矿, chalcopyrite, copper]]
  - [Au, [金, 金矿, gold]]
  - [Bi, [铋, 辉铋矿, bismuth]]
  - [Be, [铍, 绿柱石, beryl, beryllium]]
  - [Li, [锂, 锂辉石, spodumene, lithium]]
  - [NbTa, [铌钽, 铌, 钽, columbite, tantalite, niobium, tantalum]]
  - [REE, [稀土, 独居石, 氟碳铈矿, monazite, bastnasite, rare earth]]

